# Produced by: claude/ecosystem-integration
# Base commit: 62637a4b9c82c0c258bfc49e28dee1af757b1c25 (origin/main)
# Method: `git fetch origin --prune` followed by exhaustive enumeration of
#   every remote branch (`git branch -r`, 154 branches total) and an exact
#   `git rev-parse --verify origin/<name>` check for each of the seven
#   branch names named in the integration mission. No branch was assumed
#   present without this check; no branch's implementation was recreated
#   in its absence, per the mission's explicit instruction.
#
# Result: none of the seven expected dependency branches exist on the
# `ChristianV997/NeuroTopology-Sim` remote as of this fetch. There is no
# `codex/`, `antigravity/`, `cursor/streaming-performance-benchmarks`,
# `grok/`, or `grok-bot/` namespace on the remote at all (confirmed via
# `git branch -r | grep -iE 'grok|antigravity'`, zero matches). This is
# recorded as seven blockers below rather than treated as "nothing to do":
# the assembled pipeline in this PR is built to consume these adapters
# through the same public-adapter seams they were expected to fill, so a
# future PR that actually opens one of these branches can slot in without
# reshaping tools/integration_bridge/**.

