# ---------------------------------------------------------------------------
# Existing (already-on-main) public adapters this integration consumes,
# listed explicitly so overlap with any future dependency-branch merge is
# auditable at a glance.
# ---------------------------------------------------------------------------
consumed_public_adapters:
  - module: runs.run_record
    symbols: [RunRecordV1, build_run_id, read_json, write_json]
    role: "Canonical run artifact contract (guardrail: RunRecordV1 remains canonical)."
  - module: governance.spec
    symbols: [HypothesisSpec]
    role: "Governance input contract (guardrail: HypothesisSpec remains the governance input)."
  - module: governance.io
    symbols: [load_spec]
    role: "Optional HypothesisSpec loading when --spec is supplied to assemble_ecosystem_run.py."
  - module: governance.validate
    symbols: [validate_spec, ValidationError]
    role: "Hard governance gate re-used unmodified, never re-implemented."
  - module: sim.pitnn.ingest_empirical
    symbols: [ingest_empirical, ingest_conditions, empirical_to_macro_signal]
    role: "Canonical local (non-streaming) ingestion adapter; see antigravity/mne-scipy-streaming-eeg above for the deferred streaming replacement."
  - module: sim.pitnn.bayesian_falsification
    symbols: [compare_models]
    role: "Bayesian falsification gate, invoked unmodified; its own K>100 semantics are not altered by this integration."
  - module: core.topology
    symbols: [compute_Qz, compute_Qabs_slice, compute_f_dress]
    role: "Spatial winding / spatial charge metrics (guardrail: must remain separate from graph beta_1)."
  - module: analysis.connectivity_topology
    symbols: [compute_beta1]
    role: "Graph beta_1 (real persistent homology via ripser; optional dependency)."

