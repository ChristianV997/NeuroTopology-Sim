claims:
  - id: claim_triadic_is_mechanism
    source_id: triadic_fc_arxiv_2609_03987
    claim_class: unsupported_causal
    status: rejected_or_downgraded
    text: Triadic functional connectivity demonstrates a causal higher-order brain mechanism usable as PITNN or topological proof.
  - id: claim_spectral_is_mechanism
    source_id: higher_order_spectral_arxiv_2609_03172
    claim_class: unsupported_causal
    status: rejected_or_downgraded
    text: The modulogram or trispectrum establishes a causal higher-order neural mechanism for awareness or topological charge.
  - id: claim_spectral_preprint_is_replication
    source_id: higher_order_spectral_arxiv_2609_03172
    claim_class: preprint
    status: rejected_or_downgraded
    text: arXiv:2609.03172 is a peer-reviewed replication of higher-order spectral modulation.
  - id: claim_breath_is_detachment
    source_id: slow_breathing_neuron_2026_04_044
    claim_class: unsupported_causal
    status: rejected_or_downgraded
    text: Slow breathing evidence equals meditative detachment or nonattachment.
  - id: claim_discernment_equals_nonjudgment
    source_id: discernment_doi_02976_7
    claim_class: theory_or_construct
    status: rejected_or_downgraded
    text: Discernment, nonjudgment, decentering, and nonattachment are interchangeable.
  - id: claim_ecology_is_evidence
    source_id: buddhist_ecology_doi_1938434
    claim_class: theory_or_construct
    status: rejected_or_downgraded
    text: The ethical-cultural training ecology model is empirical evidence for repository theories.
  - id: claim_control_doi_is_evidence
    source_id: audit_control_unresolved_doi
    claim_class: disputed_identifier
    status: rejected_or_downgraded
    text: DOI 10.1007/s12671-026-00000-0 is a confirmed source for repository evidence.
hypotheses:
  - id: H-AUDIT-TRIADIC-DEPENDENCE
    status: proposed
    text: After pairwise and surrogate controls, residual triadic dependence may remain in some fMRI or EEG cohorts. This is a test target, not a result.
  - id: H-AUDIT-SPECTRAL-MODULOGRAM
    status: proposed
    text: A preregistered modulogram may detect modulated oscillations beyond pairwise spectra in some LFP or EEG recordings. This is a test target, not a result.
  - id: H-AUDIT-BREATH-PARASYMPATHETIC
    status: proposed
    text: Instructed exhalation can change HRV and reward-related BOLD without implying topological charge or detachment.
  - id: H-AUDIT-DISCERNMENT-NE-NONJUDGMENT
    status: proposed
    text: Discernment and nonjudgment must be coded as separate constructs in any meditation-condition contract.
  - id: H-AUDIT-TRAINING-ECOLOGY-THEORY
    status: proposed
    text: Training-ecology propositions remain theoretical until converted into preregistered empirical tests.
  - id: H-AUDIT-CONTROL-UNRESOLVED-DOI
    status: proposed
    text: Unresolved identifiers must stay out of the evidence store.
