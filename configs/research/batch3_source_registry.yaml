    authors: "MNE-Python developers"
    publication_date: "2011-ongoing"
    version_commit: "v1.13.2 (bf67729)"
    license: "BSD-3-Clause"
    evidence_class: "software_tool"
    classification: "INTEGRATE"
    adapter_boundary: "shared/tooling/capability_registry.py probe + analysis/connectivity or analysis/preprocessing adapter that calls mne.io.read_raw_* and mne.epochs.Epochs only via explicit offline fixture path; never network."
