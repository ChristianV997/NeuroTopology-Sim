literature_topics:
  - topic: "higher-order and triadic functional connectivity"
    status: "See prior audit docs/research/higher_order_literature_audit.md; all five requested identifiers confirmed or disputed; supported_for_repository=false."
    classification: "REFERENCE_ONLY"
  - topic: "bispectrum and trispectrum methods"
    status: "Classical higher-order spectral methods exist (e.g. Hagihira et al., Nikias & Petropulu). No empirical confirmation of unique identifiability from EEG/fMRI in current NeuroTopology-Sim scope. Treat as proxy descriptors."
    classification: "REFERENCE_ONLY"
  - topic: "respiratory/autonomic modulation"
    status: "Known physiological confounds (e.g. respiratory sinus arrhythmia, autonomic influence on EEG). Must be controlled or residualized in any future empirical pipeline; not currently modeled."
    classification: "REFERENCE_ONLY"
  - topic: "contemplative discernment, nonattachment, and decentering"
    status: "Psychological constructs; no direct mapping to topological observables in available data. Prior audit found no supported_for_repository claims."
    classification: "REFERENCE_ONLY"
  - topic: "prospective state-transition forecasting"
    status: "Methods exist (e.g. dynamical systems, hidden Markov). Current null-calibration and statistical-assumption audits require any forecasting claim to survive surrogate nulls; none currently pass K>100 gate."
    classification: "REFERENCE_ONLY"
  - topic: "null-model and causal-identification limits"
    status: "Core governance. Synthetic data and theory papers never yield PASS. Evidence_claim_allowed gate remains closed for all reviewed sources."
    classification: "REFERENCE_ONLY"
