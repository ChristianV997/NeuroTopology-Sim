  - "Do not modify packs #216, #225, #237, #242."
  - "Release is the sole evidence authority for packs #216/#225/#237/#242. No second evidence authority."
  - "Researchy, Nightly Audit Engineer, tinkabot, and new empty bots are this-wave NO ACT. Lingxi is out until Lead assigns post-audit. Chief of Staff is digest-later only."

