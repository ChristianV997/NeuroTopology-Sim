status_rules:
  VERIFIED: "GitHub merged=true AND merge commit is an ancestor of origin/main."
  INTEGRATED_ONLY: "Present on PR #236 / a non-main GitHub merge target. Not merged into main."
  OPEN_REVIEW: "GitHub state=OPEN (draft or ready). mergedAt is null."
  BLOCKED_BY_CI: "GitHub check rollup has COMPLETED/FAILURE. Empty-step ~3s FAILURE is not pytest."
  BLOCKED_BY_TESTS: "Reserved for independently read pytest-node failures. Unused in this Lead seed."
  BLOCKED_BY_SCIENCE: "Reserved for GitHub-supported scientific-review holds. Unused as a merge claim here."
  DUPLICATE: "Reserved. Unused — no GitHub duplicate-close evidence in this seed."
  SUPERSEDED: "Reserved for GitHub-supported supersede. #225 author-claim vs merged #216 is not this."
  NEEDS_HUMAN_REVIEW: "GitHub metadata is incomplete or contradictory without a human read."
  UNVERIFIED: "Existence or merge fact not independently confirmed from GitHub."

