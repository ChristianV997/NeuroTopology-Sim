name: fMRI-TDA ds000245

# Run the resting-state fMRI functional-connectivity + persistent-homology pipeline
# (dual_engine/fmri_tda_pipeline.py) on an already-provisioned ds000245 BIDS root.
# This workflow performs no dataset download: bounded OpenNeuro requests must be
# planned/executed separately through the manifest-first access tools.
#
# Trigger it manually from the Actions tab ("Run workflow") after provisioning the BIDS root in
# the runner environment. Results appear as (a) a rendered table in the run summary and (b) a
# downloadable `cohort-result` artifact (cohort_result.json).
#
# Method note (honest scoping): ds000245 BOLD is raw/native-space (no fMRIPrep normalization in
# this pipeline). The default parcellation is therefore a deterministic NATIVE-SPACE coordinate
# parcellation -- reproducible but NOT an anatomical atlas. Supplying an MNI atlas here without
# registration would silently mis-register, so the optional atlas must already be local and native-space.

on:
  workflow_dispatch:
    inputs:
      groups:
        description: "Groups to process (space-separated subset of: CTL ODN ODP)"
        required: false
        default: "CTL ODN ODP"
      bids_root:
        description: "Already-provisioned local BIDS root; no download is performed"
        required: true
        default: "data/ds000245"
      atlas_path:
        description: "Optional local native-space labels NIfTI path; remote URLs are rejected"
        required: false
        default: ""

permissions:
  contents: read

env:
  DATASET: ds000245
  T_R: "2.5"
  PIP_NO_CACHE_DIR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  AWS_EC2_METADATA_DISABLED: "true"

jobs:
  # ---- Fan-out: one job per group over the pre-provisioned local BIDS root ----
  run-group:
    name: "Process ${{ matrix.group }}"
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        group: [CTL, ODN, ODP]
    steps:
      - uses: actions/checkout@v7

      - name: Skip if group not requested
        id: gate
        run: |
          if echo "${{ github.event.inputs.groups }}" | grep -qw "${{ matrix.group }}"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Group ${{ matrix.group }} not in requested set -- skipping."
          fi

      - name: Prepare bounded pip temp directory
        if: steps.gate.outputs.run == 'true'
        run: |
          pip_tmp="${RUNNER_TEMP}/nts-pip-tmp"
          mkdir -p "$pip_tmp"
          echo "TMPDIR=$pip_tmp" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v7
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m pip install --no-cache-dir --disable-pip-version-check nibabel nilearn ripser networkx statsmodels scikit-learn scipy numpy pandas

      - name: Require pre-provisioned BIDS root
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          bids_root="${{ inputs.bids_root }}"
          test -n "$bids_root" || { echo "bids_root is required; no remote acquisition is available in this workflow." >&2; exit 2; }
          test -d "$bids_root" || { echo "pre-provisioned BIDS root not found: $bids_root" >&2; exit 2; }

      - name: Validate optional local atlas path
        if: steps.gate.outputs.run == 'true' && inputs.atlas_path != ''
        run: |
          set -euo pipefail
          test -f "${{ inputs.atlas_path }}" || { echo "local atlas path not found: ${{ inputs.atlas_path }}" >&2; exit 2; }

      - name: Run pipeline for ${{ matrix.group }}
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          ATLAS_ARGS=()
          if [[ -n "${{ inputs.atlas_path }}" ]]; then
            ATLAS_ARGS=(--atlas "${{ inputs.atlas_path }}")
          fi
          python -m dual_engine.fmri_tda_pipeline \
            --bids-root "${{ inputs.bids_root }}" \
            --group "${{ matrix.group }}" \
            --t-r "${T_R}" \
            "${ATLAS_ARGS[@]}" \
            --emit-subjects "outputs/fmri_tda/subjects_${{ matrix.group }}.json"

      - name: Upload per-group results
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: subjects-${{ matrix.group }}
          path: outputs/fmri_tda/subjects_${{ matrix.group }}.json
          if-no-files-found: error
          retention-days: 14

      - name: Clean package temporary files
        if: always()
        run: |
          python -m pip cache purge || true
          if [ -n "${TMPDIR:-}" ] && [ -d "$TMPDIR" ]; then rm -rf -- "$TMPDIR"; fi

  # ---- Aggregate: merge the per-group subject files -> cohort stats + rendered summary ----
  aggregate:
    name: Aggregate cohort + group statistics
    needs: run-group
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Prepare bounded pip temp directory
        run: |
          pip_tmp="${RUNNER_TEMP}/nts-pip-tmp"
          mkdir -p "$pip_tmp"
          echo "TMPDIR=$pip_tmp" >> "$GITHUB_ENV"

      - name: Install minimal deps
        run: python -m pip install --no-cache-dir --disable-pip-version-check numpy scipy

      - name: Collect per-group artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: subjects-*
          path: incoming
          merge-multiple: true

      - name: Aggregate + write step summary
        run: |
          set -euo pipefail
          shopt -s nullglob
          FILES=(incoming/subjects_*.json)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "## fMRI-TDA ds000245 — no per-group results found" >> "$GITHUB_STEP_SUMMARY"
            echo "All group jobs failed or were skipped; nothing to aggregate." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          python -m dual_engine.fmri_tda_pipeline --aggregate "${FILES[@]}" --out outputs/fmri_tda
          {
            echo ""
            echo "---"
            echo "_Parcellation: native-space coordinate parcellation (not an anatomical atlas; no MNI registration in this pipeline). Covariates, if present, come only from the pre-provisioned BIDS root; this workflow does not validate scientific provenance or establish evidence. Interpret any downstream statistics with effect sizes + CIs, not bare p-values._"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload cohort result
        uses: actions/upload-artifact@v4
        with:
          name: cohort-result
          path: |
            outputs/fmri_tda/cohort_result.json
            outputs/fmri_tda/summary.md
          if-no-files-found: error
          retention-days: 90

      - name: Clean package temporary files
        if: always()
        run: |
          python -m pip cache purge || true
          if [ -n "${TMPDIR:-}" ] && [ -d "$TMPDIR" ]; then rm -rf -- "$TMPDIR"; fi
