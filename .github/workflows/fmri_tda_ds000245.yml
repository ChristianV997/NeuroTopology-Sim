name: fMRI-TDA ds000245 metadata preflight

# This workflow is intentionally metadata-only. Signal analysis is admitted
# only after a reviewed bounded manifest exists with object identity, size,
# checksum state, byte ranges, cache budget, output containment, and eviction
# policy. No BOLD or atlas bytes are downloaded here.

on:
  workflow_dispatch:
    inputs:
      groups:
        description: "Groups to record in the preflight (no signal data is read)"
        required: false
        default: "CTL ODN ODP"
      allow_metadata_network:
        description: "Permit bounded OpenNeuro object-metadata listing only"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  DATASET: ds000245

jobs:
  metadata-plan:
    name: OpenNeuro metadata-only preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Prepare explicit metadata output root
        run: mkdir -p outputs/fmri_tda_metadata

      - name: Emit offline bounded-access blocker
        if: ${{ inputs.allow_metadata_network != true }}
        env:
          GROUPS: ${{ inputs.groups }}
        run: |
          set -euo pipefail
          GROUPS="$GROUPS" python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "schema_version": "NeuroTopology.OpenNeuroMetadataPreflight.v1",
              "dataset_id": os.environ["DATASET"],
              "requested_groups": os.environ.get("GROUPS", ""),
              "status": "BLOCKED_OFFLINE",
              "metadata_only": True,
              "network_accessed": False,
              "data_materialized": False,
              "manifest_first": True,
              "reason": "metadata network permission was not explicitly granted",
              "next_action": "rerun with allow_metadata_network=true or supply a reviewed bounded manifest",
          }
          Path("outputs/fmri_tda_metadata/preflight.json").write_text(
              json.dumps(payload, sort_keys=True, indent=2, allow_nan=False) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Inventory bounded object metadata only
        if: ${{ inputs.allow_metadata_network == true }}
        env:
          GROUPS: ${{ inputs.groups }}
        run: |
          set -euo pipefail
          command -v aws >/dev/null
          timeout 120s aws s3api list-objects-v2 \
            --no-sign-request \
            --bucket openneuro.org \
            --prefix "${DATASET}/" \
            --max-items 1000 \
            --page-size 100 \
            --output json \
            > outputs/fmri_tda_metadata/openneuro_object_inventory.raw.json
          GROUPS="$GROUPS" python - <<'PY'
          import json
          import os
          from pathlib import Path

          raw = json.loads(Path("outputs/fmri_tda_metadata/openneuro_object_inventory.raw.json").read_text(encoding="utf-8"))
          objects = [
              {
                  "key": item.get("Key"),
                  "size_bytes": item.get("Size"),
                  "etag": item.get("ETag"),
                  "last_modified": item.get("LastModified"),
                  "storage_class": item.get("StorageClass"),
              }
              for item in raw.get("Contents", []) or []
          ]
          payload = {
              "schema_version": "NeuroTopology.OpenNeuroMetadataPreflight.v1",
              "dataset_id": os.environ["DATASET"],
              "requested_groups": os.environ.get("GROUPS", ""),
              "status": "METADATA_ONLY",
              "metadata_only": True,
              "network_accessed": True,
              "data_materialized": False,
              "manifest_first": True,
              "bounded_listing": {"max_items": 1000, "timeout_seconds": 120},
              "objects": objects,
              "next_action": "author and review explicit bounded ranges with checksums before any signal access",
          }
          Path("outputs/fmri_tda_metadata/preflight.json").write_text(
              json.dumps(payload, sort_keys=True, indent=2, allow_nan=False) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Summarize preflight scope
        if: always()
        run: |
          {
            echo "## ds000245 — metadata-only preflight"
            echo ""
            echo "No BOLD signal bytes or atlas bytes are materialized by this workflow."
            echo "A bounded manifest is required before analysis."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload metadata preflight
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ds000245-metadata-preflight
          path: outputs/fmri_tda_metadata/
          if-no-files-found: error
          retention-days: 14
