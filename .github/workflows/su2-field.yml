name: SU2 field foundation

on:
  pull_request:
    paths:
      - 'field_theory/su2/**'
      - 'field_theory/__init__.py'
      - 'tests/test_su2_field_foundation.py'
      - '.github/workflows/su2-field.yml'
  push:
    branches: [main]
    paths:
      - 'field_theory/su2/**'
      - 'field_theory/__init__.py'
      - 'tests/test_su2_field_foundation.py'
      - '.github/workflows/su2-field.yml'

permissions:
  contents: read

jobs:
  su2-field-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install focused test dependencies
        run: python -m pip install 'numpy>=1.24.0' 'pytest>=7.0.0' 'pytest-timeout>=2.3.0'
      - name: Run SU2 field contract tests
        run: python -m pytest tests/test_su2_field_foundation.py -q -p no:cacheprovider

