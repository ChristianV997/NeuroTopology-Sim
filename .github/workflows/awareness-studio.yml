name: Awareness Studio

on:
  push:
    branches: [main]
    paths:
      - "apps/awareness_studio/**"
      - "runs/**"
      - "sim/**"
      - "governance/**"
      - "pipelines/hypothesis.py"
      - ".github/workflows/awareness-studio.yml"
  pull_request:
    branches: ["**"]
    paths:
      - "apps/awareness_studio/**"
      - "runs/**"
      - "sim/**"
      - "governance/**"
      - "pipelines/hypothesis.py"
      - ".github/workflows/awareness-studio.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EMBEDDING_PROVIDER: local_stub
  EMBEDDING_DIM: "64"
  MPLBACKEND: Agg
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  PIP_NO_CACHE_DIR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  test:
    name: "Python ${{ matrix.python-version }} — offline tests"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    defaults:
      run:
        working-directory: apps/awareness_studio

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Prepare bounded pip temp directory
        run: |
          pip_tmp="${RUNNER_TEMP}/nts-pip-tmp"
          mkdir -p "$pip_tmp"
          echo "TMPDIR=$pip_tmp" >> "$GITHUB_ENV"

      - name: Install package + dev + embeddings deps
        env:
          ANTHROPIC_API_KEY: ""
          OPENAI_API_KEY: ""
        run: python -m pip install --no-cache-dir --disable-pip-version-check -e ".[dev,embeddings]"

      - name: Run offline test suite
        env:
          ANTHROPIC_API_KEY: ""
          OPENAI_API_KEY: ""
        run: pytest -v --tb=short

      - name: Eval harness — no-llm golden check
        env:
          ANTHROPIC_API_KEY: ""
          OPENAI_API_KEY: ""
        run: python -m awareness_studio.eval_runner --no-llm --quiet

      - name: Capture install or test diagnostics
        if: failure()
        run: |
          {
            echo "## runner diagnostics"
            date -u
            df -h
            python -m pip cache info || true
            du -sh "$RUNNER_TEMP" . 2>/dev/null || true
          } | tee awareness-failure.txt

      - name: Clean package temporary files
        if: always()
        run: |
          python -m pip cache purge || true
          if [ -n "${TMPDIR:-}" ] && [ -d "$TMPDIR" ]; then rm -rf -- "$TMPDIR"; fi

      - name: Upload Awareness diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: awareness-studio-${{ matrix.python-version }}-diagnostics
          path: apps/awareness_studio/awareness-failure.txt
          if-no-files-found: warn
