name: Awareness Studio

on:
  push:
    branches: ["**"]
    paths:
      - "apps/awareness_studio/**"
      - "runs/**"
      - "sim/**"
      - "governance/**"
      - "pipelines/hypothesis.py"
      - ".github/workflows/awareness-studio.yml"
  pull_request:
    branches: ["**"]
    paths:
      - "apps/awareness_studio/**"
      - "runs/**"
      - "sim/**"
      - "governance/**"
      - "pipelines/hypothesis.py"
      - ".github/workflows/awareness-studio.yml"
  workflow_dispatch:

jobs:
  test:
    name: "Python ${{ matrix.python-version }} — offline tests"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    defaults:
      run:
        working-directory: apps/awareness_studio

    env:
      EMBEDDING_PROVIDER: local_stub
      EMBEDDING_DIM: "64"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + dev + embeddings deps
        run: python -m pip install --no-cache-dir --disable-pip-version-check -e ".[dev,embeddings]"

      - name: Run offline test suite
        env:
          ANTHROPIC_API_KEY: ""
          OPENAI_API_KEY: ""
        run: pytest -v --tb=short

      - name: Eval harness — no-llm golden check
        env:
          ANTHROPIC_API_KEY: ""
          OPENAI_API_KEY: ""
        run: python -m awareness_studio.eval_runner --no-llm --quiet

      - name: Emit finite Awareness diagnostic
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: >
          python ../../scripts/validate_release_ci_contract.py
          --diagnostic --workflow "Awareness Studio" --job test --step pytest
          --message "job status: ${JOB_STATUS}"
          --artifact-path apps/awareness_studio/outputs/ci_diagnostics/offline.json
          --json-out outputs/ci_diagnostics/offline.json

      - name: Upload Awareness diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: awareness-offline-ci-diagnostic-${{ matrix.python-version }}
          path: apps/awareness_studio/outputs/ci_diagnostics/offline.json
          if-no-files-found: error
