name: SU2 static field visualization

on:
  pull_request:
    paths:
      - 'field_theory/su2/field_visualization.py'
      - 'tests/test_su2_field_visualization.py'
      - '.github/workflows/su2-static-field-visualization.yml'
  push:
    branches: [main]
    paths:
      - 'field_theory/su2/field_visualization.py'
      - 'tests/test_su2_field_visualization.py'
      - '.github/workflows/su2-static-field-visualization.yml'

permissions:
  contents: read

jobs:
  static-field-visualization-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install focused visualization test dependencies
        run: python -m pip install 'numpy>=1.24.0' 'pytest>=7.0.0' 'matplotlib>=3.7.0' 'pytest-timeout>=2.3.0'
      - name: Run static SU2 field visualization tests
        run: python -m pytest tests/test_su2_field_visualization.py -q -p no:cacheprovider
