name: Smoke

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ANTHROPIC_API_KEY: ""
  OPENAI_API_KEY: ""
  INDEX_BACKEND: bm25
  EMBEDDING_PROVIDER: local_stub
  EMBEDDING_DIM: "64"
  TOOLS_ENABLED: "false"
  AIRTABLE_ENABLED: "false"
  AUTH_ENABLED: "false"
  MPLBACKEND: Agg
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  PIP_NO_CACHE_DIR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  smoke:
    name: Cross-system smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Prepare bounded pip temp directory
        run: |
          pip_tmp="${RUNNER_TEMP}/nts-pip-tmp"
          mkdir -p "$pip_tmp"
          echo "TMPDIR=$pip_tmp" >> "$GITHUB_ENV"

      - name: Install CPU/base profile only
        run: python -m pip install --no-cache-dir --disable-pip-version-check -r requirements-base.txt

      - name: Root synthetic smoke
        run: python main.py --mode synthetic

      - name: Hypothesis pipeline smoke
        run: |
          if [ -f governance/specs/HYP-20260507-001.yaml ]; then
            python -m pipelines.hypothesis \
              --spec governance/specs/HYP-20260507-001.yaml \
              --output artifacts/ci_smoke
          else
            echo "No bundled flat-format spec found; skipping hypothesis smoke"
          fi

      - name: Install Awareness Studio
        working-directory: apps/awareness_studio
        run: python -m pip install --no-cache-dir --disable-pip-version-check -e ".[dev,embeddings]"

      - name: Export sim artifacts
        run: |
          if [ -d artifacts ]; then
            python -m apps.awareness_studio.tools.export_sim_artifacts \
              --artifacts-root artifacts \
              --out-dir apps/awareness_studio/inputs/sim_artifacts
          else
            echo "No artifacts directory; skipping export"
          fi

      - name: Build Awareness index
        working-directory: apps/awareness_studio
        run: python -m awareness_studio.index_build --force

      - name: Awareness eval no-LLM
        working-directory: apps/awareness_studio
        run: python -m awareness_studio.eval_runner --no-llm --quiet

      - name: Capture install or smoke diagnostics
        if: failure()
        run: |
          {
            echo "## runner diagnostics"
            date -u
            df -h
            python -m pip cache info || true
            du -sh "$RUNNER_TEMP" . 2>/dev/null || true
          } | tee smoke-failure.txt

      - name: Clean package temporary files
        if: always()
        run: |
          python -m pip cache purge || true
          if [ -n "${TMPDIR:-}" ] && [ -d "$TMPDIR" ]; then rm -rf -- "$TMPDIR"; fi

      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-system-smoke-diagnostics
          path: smoke-failure.txt
          if-no-files-found: warn
