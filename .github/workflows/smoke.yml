name: Smoke

on:
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  smoke:
    name: Cross-system smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30

    env:
      PIP_NO_CACHE_DIR: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      ANTHROPIC_API_KEY: ""
      OPENAI_API_KEY: ""
      INDEX_BACKEND: bm25
      EMBEDDING_PROVIDER: local_stub
      EMBEDDING_DIM: "64"
      TOOLS_ENABLED: "false"
      AIRTABLE_ENABLED: "false"
      AUTH_ENABLED: "false"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install root dependencies
        run: python -m pip install --no-cache-dir --disable-pip-version-check -r requirements-base.txt

      - name: Root synthetic smoke
        run: python main.py --mode synthetic

      - name: Hypothesis pipeline smoke
        # Uses HYP-20260507-001.yaml (flat spec format for pipelines/hypothesis.py run())
        run: |
          if [ -f governance/specs/HYP-20260507-001.yaml ]; then
            python -m pipelines.hypothesis \
              --spec governance/specs/HYP-20260507-001.yaml \
              --output artifacts/ci_smoke
          else
            echo "NOT_SUPPORTED: no bundled flat-format spec found; hypothesis smoke unavailable"
          fi

      - name: Install Awareness Studio
        working-directory: apps/awareness_studio
        run: pip install -e ".[dev,embeddings]"

      - name: Export sim artifacts
        run: |
          if [ -d artifacts ]; then
            python -m apps.awareness_studio.tools.export_sim_artifacts \
              --artifacts-root artifacts \
              --out-dir apps/awareness_studio/inputs/sim_artifacts
          else
            echo "NOT_SUPPORTED: no artifacts directory; artifact export unavailable"
          fi

      - name: Build Awareness index
        working-directory: apps/awareness_studio
        run: python -m awareness_studio.index_build --force

      - name: Awareness eval no-LLM
        working-directory: apps/awareness_studio
        run: python -m awareness_studio.eval_runner --no-llm --quiet

      - name: Emit finite smoke diagnostic
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: >
          python scripts/validate_release_ci_contract.py
          --diagnostic --workflow Smoke --job smoke --step smoke
          --message "job status: ${JOB_STATUS}"
          --artifact-path outputs/ci_diagnostics/smoke.json
          --json-out outputs/ci_diagnostics/smoke.json

      - name: Upload smoke diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-ci-diagnostic
          path: outputs/ci_diagnostics/smoke.json
          if-no-files-found: error
