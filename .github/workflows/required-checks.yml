name: Required Checks

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      diff_base_sha:
        description: Full base commit SHA for candidate-path discovery
        required: true
        type: string
      diff_head_sha:
        description: Full head commit SHA for candidate-path discovery
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PIP_NO_CACHE_DIR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  core-tests:
    name: core-tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read

    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      PIP_NO_CACHE_DIR: "1"

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Prepare bounded pip temp directory
        run: |
          pip_tmp="${RUNNER_TEMP}/nts-pip-tmp"
          mkdir -p "$pip_tmp"
          echo "TMPDIR=$pip_tmp" >> "$GITHUB_ENV"

      - name: Install CPU/base profile only
        id: install_base
        run: python -m pip install --no-cache-dir --disable-pip-version-check -r requirements-base.txt

      - name: Run core tests in isolated batches
        # Do not include research-profile tests here. test_topology.py has a
        # module-level cripser gate and belongs to the explicit research job.
        run: >
          python scripts/run_tests_isolated.py
          --batch-size 1
          --timeout-s 120
          --report outputs/required_core_test_report.json
          tests/test_run_record.py
          tests/test_run_records.py
          tests/test_benchmarks_registry.py
          tests/test_pipeline_job_schema.py
          tests/test_transitions_governance.py
          tests/test_transitions_features.py
          tests/btc_icft/test_report_guardrails.py
          tests/btc_icft/test_ontology_schema.py
          tests/runner/test_runner_isolation.py
          tests/audits/test_live_repo_pr_ownership_map.py
          tests/ci/test_round6_experimental_discovery.py
          tests/docker_context/test_build_context_policy.py

      - name: Discover and run changed Round 6 candidate suites
        if: ${{ !cancelled() && steps.install_base.outcome == 'success' }}
        env:
          DIFF_BASE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.diff_base_sha || github.event.pull_request.base.sha || github.event.before }}
          DIFF_HEAD_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.diff_head_sha || github.event.pull_request.head.sha || github.sha }}
          TESTED_CHECKOUT_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: >-
          python .github/workflows/round6_experimental_tests.py
          --diff-base "$DIFF_BASE_SHA"
          --diff-head "$DIFF_HEAD_SHA"
          --tested-checkout "$TESTED_CHECKOUT_SHA"
          --workflow-sha "$WORKFLOW_SHA"
          --event-name "$EVENT_NAME"
          --report outputs/round6_experimental_ci_report.json

      - name: Smoke-test synthetic mode
        run: python main.py --mode synthetic

      - name: Capture install or test diagnostics
        if: failure()
        run: |
          {
            echo "## runner diagnostics"
            date -u
            df -h
            python -m pip cache info || true
            du -sh "$RUNNER_TEMP" . 2>/dev/null || true
          } | tee test-results-core-failure.txt

      - name: Clean package temporary files
        if: always()
        run: |
          python -m pip cache purge || true
          if [ -n "${TMPDIR:-}" ] && [ -d "$TMPDIR" ]; then rm -rf -- "$TMPDIR"; fi

      - name: Upload core diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: required-core-test-report
          path: |
            outputs/required_core_test_report.json
            outputs/round6_experimental_ci_report.json
            outputs/round6-experimental-logs/**
            test-results-core-failure.txt
          if-no-files-found: warn

  docker-context-engine:
    name: docker-context-engine
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      PIP_NO_CACHE_DIR: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Select Docker-context candidate paths
        id: candidate_scope
        env:
          DIFF_BASE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.diff_base_sha || github.event.pull_request.base.sha || github.event.before }}
          DIFF_HEAD_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.diff_head_sha || github.event.pull_request.head.sha || github.sha }}
          TESTED_CHECKOUT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for sha in "$DIFF_BASE_SHA" "$DIFF_HEAD_SHA"; do
            if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Docker candidate discovery requires explicit full base/head SHAs"
              exit 2
            fi
          done
          changed_paths="$(git diff --name-only "$DIFF_BASE_SHA...$DIFF_HEAD_SHA")"
          if grep -Fxq '.dockerignore' <<< "$changed_paths" || \
             grep -Fxq 'tests/docker_context/test_docker_engine_build_context.py' <<< "$changed_paths"; then
            checkout_sha="$(git rev-parse HEAD)"
            if [[ "$checkout_sha" != "$TESTED_CHECKOUT_SHA" ]] || \
               ! git merge-base --is-ancestor "$DIFF_HEAD_SHA" "$checkout_sha"; then
              echo "::error::Docker candidate head is not present in the tested checkout"
              exit 1
            fi
            if [[ ! -f tests/docker_context/test_docker_engine_build_context.py ]]; then
              echo "::error::Docker-context candidate changed, but its registered engine test is absent"
              exit 1
            fi
            echo "docker_context_changed=true" >> "$GITHUB_OUTPUT"
            echo "Docker-context candidate paths changed; the Docker Engine test is required."
          else
            echo "docker_context_changed=false" >> "$GITHUB_OUTPUT"
            echo "NOT_APPLICABLE: no Docker-context candidate path changed."
          fi

      - name: Prepare bounded pip temp directory
        if: steps.candidate_scope.outputs.docker_context_changed == 'true'
        run: |
          pip_tmp="${RUNNER_TEMP}/nts-docker-pip-tmp"
          mkdir -p "$pip_tmp"
          echo "TMPDIR=$pip_tmp" >> "$GITHUB_ENV"

      - name: Install CPU/base test profile only
        if: steps.candidate_scope.outputs.docker_context_changed == 'true'
        run: python -m pip install --no-cache-dir --disable-pip-version-check -r requirements-base.txt

      - name: Verify hosted Docker Engine
        if: steps.candidate_scope.outputs.docker_context_changed == 'true'
        run: docker info --format '{{.ServerVersion}}'

      - name: Run Docker-context verifier in an isolated process
        if: steps.candidate_scope.outputs.docker_context_changed == 'true'
        run: |
          set -euo pipefail
          mkdir -p outputs
          python scripts/run_tests_isolated.py \
            --batch-size 1 \
            --timeout-s 120 \
            --report outputs/docker_context_engine_test_report.json \
            --pytest-arg=--junitxml=outputs/docker_context_engine_test_report.junit.xml \
          tests/docker_context/test_docker_engine_build_context.py
          python - <<'PY'
          import runpy
          from pathlib import Path

          expected_file = "tests/docker_context/test_docker_engine_build_context.py"
          helper = runpy.run_path(".github/workflows/round6_experimental_tests.py")
          valid, reason, test_count = helper["validate_docker_engine_test_artifacts"](
              Path.cwd(),
              Path("outputs/docker_context_engine_test_report.json"),
              Path("outputs/docker_context_engine_test_report.junit.xml"),
              expected_file,
          )
          if not valid:
              raise SystemExit(reason)
          print(
              f"Docker Engine candidate suite PASS: {test_count} tests, "
              "0 skipped, 0 failures, 0 errors, 0 timeouts"
          )
          PY

      - name: Capture Docker-context diagnostics
        if: failure()
        run: |
          {
            echo "## Docker-context runner diagnostics"
            date -u
            df -h
            docker version || true
            du -sh "$RUNNER_TEMP" . 2>/dev/null || true
          } | tee docker-context-engine-failure.txt

      - name: Clean Docker-context temporary files
        if: always()
        run: |
          python -m pip cache purge || true
          if [ -n "${TMPDIR:-}" ] && [ -d "$TMPDIR" ]; then rm -rf -- "$TMPDIR"; fi

      - name: Upload Docker-context diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-context-engine-test-report
          path: |
            outputs/docker_context_engine_test_report.json
            outputs/docker_context_engine_test_report.junit.xml
            docker-context-engine-failure.txt
          if-no-files-found: warn

  awareness-tests:
    name: awareness-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    defaults:
      run:
        working-directory: apps/awareness_studio

    env:
      EMBEDDING_PROVIDER: local_stub
      EMBEDDING_DIM: "64"
      MPLBACKEND: Agg
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Prepare bounded pip temp directory
        run: |
          pip_tmp="${RUNNER_TEMP}/nts-pip-tmp"
          mkdir -p "$pip_tmp"
          echo "TMPDIR=$pip_tmp" >> "$GITHUB_ENV"

      - name: Install Awareness package and dev extras
        env:
          ANTHROPIC_API_KEY: ""
          OPENAI_API_KEY: ""
        run: python -m pip install --no-cache-dir --disable-pip-version-check -e ".[dev]"

      - name: Run Awareness tests
        env:
          ANTHROPIC_API_KEY: ""
          OPENAI_API_KEY: ""
        run: pytest -q tests

      - name: Capture install or test diagnostics
        if: failure()
        run: |
          {
            echo "## runner diagnostics"
            date -u
            df -h
            python -m pip cache info || true
            du -sh "$RUNNER_TEMP" . 2>/dev/null || true
          } | tee awareness-failure.txt

      - name: Clean package temporary files
        if: always()
        run: |
          python -m pip cache purge || true
          if [ -n "${TMPDIR:-}" ] && [ -d "$TMPDIR" ]; then rm -rf -- "$TMPDIR"; fi

      - name: Upload Awareness diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: awareness-test-diagnostics
          path: apps/awareness_studio/awareness-failure.txt
          if-no-files-found: warn
