name: Required Checks

on:
  pull_request:
  push:
    branches:
      - main

env:
  PIP_NO_CACHE_DIR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  core-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install root base dependencies
        run: python -m pip install --no-cache-dir --disable-pip-version-check -r requirements-base.txt

      - name: Run core tests in isolated batches
        # Scientific Python extensions can retain native allocations across a
        # monolithic collection. The bounded runner keeps discovery intact
        # while giving each batch a fresh interpreter and a hard timeout.
        run: >
          python scripts/run_tests_isolated.py
          --batch-size 1
          --timeout-s 120
          --report outputs/required_core_test_report.json
          tests/test_run_record.py
          tests/test_run_records.py
          tests/test_topology.py
          tests/test_benchmarks_registry.py
          tests/test_transitions_governance.py
          tests/test_transitions_features.py
          tests/btc_icft/test_report_guardrails.py
          tests/btc_icft/test_ontology_schema.py
          tests/runner/test_runner_isolation.py

      - name: Emit finite CI diagnostic
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: >
          python scripts/validate_release_ci_contract.py
          --diagnostic --workflow "Required Checks" --job core-tests --step pytest
          --message "job status: ${JOB_STATUS}"
          --artifact-path outputs/ci_diagnostics/required-core.json
          --json-out outputs/ci_diagnostics/required-core.json

      - name: Upload core failure diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: required-core-ci-diagnostic
          path: |
            outputs/required_core_test_report.json
            outputs/ci_diagnostics/required-core.json
          if-no-files-found: error

  awareness-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/awareness_studio

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Awareness package and dev extras
        run: python -m pip install --no-cache-dir --disable-pip-version-check -e '.[dev]'

      - name: Run Awareness tests
        run: pytest -q tests

      - name: Emit finite CI diagnostic
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: >
          python ../../scripts/validate_release_ci_contract.py
          --diagnostic --workflow "Required Checks" --job awareness-tests --step pytest
          --message "job status: ${JOB_STATUS}"
          --artifact-path apps/awareness_studio/outputs/ci_diagnostics/awareness.json
          --json-out outputs/ci_diagnostics/awareness.json

      - name: Upload Awareness failure diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: awareness-ci-diagnostic
          path: apps/awareness_studio/outputs/ci_diagnostics/awareness.json
          if-no-files-found: error
