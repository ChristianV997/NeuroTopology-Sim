name: Required Checks

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PIP_NO_CACHE_DIR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  core-tests:
    name: core-tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Prepare bounded pip temp directory
        run: |
          pip_tmp="${RUNNER_TEMP}/nts-pip-tmp"
          mkdir -p "$pip_tmp"
          echo "TMPDIR=$pip_tmp" >> "$GITHUB_ENV"

      - name: Install CPU/base profile only
        run: python -m pip install --no-cache-dir --disable-pip-version-check -r requirements-base.txt

      - name: Run core tests in isolated batches
        # Do not include research-profile tests here. test_topology.py has a
        # module-level cripser gate and belongs to the explicit research job.
        run: >
          python scripts/run_tests_isolated.py
          --batch-size 8
          --timeout-s 120
          --report outputs/required_core_test_report.json
          tests/test_run_record.py
          tests/test_run_records.py
          tests/test_benchmarks_registry.py
          tests/test_pipeline_job_schema.py
          tests/test_transitions_governance.py
          tests/test_transitions_features.py
          tests/btc_icft/test_report_guardrails.py
          tests/btc_icft/test_ontology_schema.py
          tests/runner/test_runner_isolation.py

      - name: Smoke-test synthetic mode
        run: python main.py --mode synthetic

      - name: Capture install or test diagnostics
        if: failure()
        run: |
          {
            echo "## runner diagnostics"
            date -u
            df -h
            python -m pip cache info || true
            du -sh "$RUNNER_TEMP" . 2>/dev/null || true
          } | tee test-results-core-failure.txt

      - name: Clean package temporary files
        if: always()
        run: |
          python -m pip cache purge || true
          if [ -n "${TMPDIR:-}" ] && [ -d "$TMPDIR" ]; then rm -rf -- "$TMPDIR"; fi

      - name: Upload core diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: required-core-test-report
          path: |
            outputs/required_core_test_report.json
            test-results-core-failure.txt
          if-no-files-found: warn

  awareness-tests:
    name: awareness-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    defaults:
      run:
        working-directory: apps/awareness_studio

    env:
      EMBEDDING_PROVIDER: local_stub
      EMBEDDING_DIM: "64"
      MPLBACKEND: Agg
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Prepare bounded pip temp directory
        run: |
          pip_tmp="${RUNNER_TEMP}/nts-pip-tmp"
          mkdir -p "$pip_tmp"
          echo "TMPDIR=$pip_tmp" >> "$GITHUB_ENV"

      - name: Install Awareness package and dev extras
        env:
          ANTHROPIC_API_KEY: ""
          OPENAI_API_KEY: ""
        run: python -m pip install --no-cache-dir --disable-pip-version-check -e ".[dev]"

      - name: Run Awareness tests
        env:
          ANTHROPIC_API_KEY: ""
          OPENAI_API_KEY: ""
        run: pytest -q tests

      - name: Capture install or test diagnostics
        if: failure()
        run: |
          {
            echo "## runner diagnostics"
            date -u
            df -h
            python -m pip cache info || true
            du -sh "$RUNNER_TEMP" . 2>/dev/null || true
          } | tee awareness-failure.txt

      - name: Clean package temporary files
        if: always()
        run: |
          python -m pip cache purge || true
          if [ -n "${TMPDIR:-}" ] && [ -d "$TMPDIR" ]; then rm -rf -- "$TMPDIR"; fi

      - name: Upload Awareness diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: awareness-test-diagnostics
          path: apps/awareness_studio/awareness-failure.txt
          if-no-files-found: warn
