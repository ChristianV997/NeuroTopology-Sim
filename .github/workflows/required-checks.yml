name: Required Checks

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  core-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install root dependencies
        run: pip install -r requirements.txt

      - name: Run core tests in isolated batches
        # Scientific Python extensions can retain native allocations across a
        # monolithic collection.  The bounded runner keeps discovery intact
        # while giving each batch a fresh interpreter and a hard timeout.
        run: python scripts/run_tests_isolated.py --batch-size 8 --timeout-s 120

  awareness-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/awareness_studio

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Awareness package and dev extras
        run: pip install -e '.[dev]'

      - name: Run Awareness tests
        run: pytest -q tests
