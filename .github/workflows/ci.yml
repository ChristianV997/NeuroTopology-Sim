name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  governance-validate:
    name: Governance validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install governance dependency
        run: python -m pip install --no-cache-dir pyyaml

      - name: Validate governance specs
        run: python -m governance.validate

  test:
    name: "Python ${{ matrix.python-version }} tests"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: governance-validate
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      PIP_NO_CACHE_DIR: "1"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CPU PyTorch before root dependencies
        run: python -m pip install --no-cache-dir --no-deps --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple "torch==2.9.1+cpu" "torchaudio==2.9.1+cpu"

      - name: Install root dependencies without pip cache
        run: python -m pip install --no-cache-dir -r requirements.txt

      - name: Run tests in isolated batches
        run: python scripts/run_tests_isolated.py --batch-size 8 --timeout-s 120 --report-dir test-results/isolated

      - name: Upload isolated batch report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-test-report-${{ matrix.python-version }}
          path: test-results/isolated/
          if-no-files-found: warn

      - name: Smoke-test synthetic mode
        run: python main.py --mode synthetic
