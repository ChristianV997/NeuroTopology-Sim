name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_NO_CACHE_DIR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  governance-validate:
    name: Governance validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install base dependencies
        run: python -m pip install --no-cache-dir --disable-pip-version-check -r requirements-base.txt

      - name: Validate governance specs
        run: python -m governance.validate

      - name: Emit finite CI diagnostic
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: >
          python scripts/validate_release_ci_contract.py
          --diagnostic --workflow CI --job governance-validate --step governance
          --message "job status: ${JOB_STATUS}"
          --artifact-path outputs/ci_diagnostics/governance.json
          --json-out outputs/ci_diagnostics/governance.json

      - name: Upload governance diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-governance-diagnostic
          path: outputs/ci_diagnostics/governance.json
          if-no-files-found: error

  dependency-inventory:
    name: Dependency inventory audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Audit requirement profile manifests
        run: |
          python -c "
          from pathlib import Path
          profiles = [
              'requirements-base.txt',
              'requirements-eeg.txt',
              'requirements-nwb.txt',
              'requirements-live.txt',
              'requirements-ml.txt',
              'requirements-research.txt',
              'requirements-quantum.txt',
              'requirements.txt',
          ]
          for p in profiles:
              assert Path(p).exists(), f'Missing {p}'
              lines = [l.strip() for l in Path(p).read_text().splitlines() if l.strip() and not l.startswith('#')]
              print(f'Profile {p}: {len(lines)} declarations')
          "

  release-ci-contract:
    name: Release CI contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: dependency-inventory
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install contract validator dependency
        run: python -m pip install --no-cache-dir --disable-pip-version-check pyyaml

      - name: Validate release CI contract
        run: >
          python scripts/validate_release_ci_contract.py
          --root .
          --json-out outputs/ci_diagnostics/release-ci-contract.json

      - name: Upload release CI contract report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-ci-contract-report
          path: outputs/ci_diagnostics/release-ci-contract.json
          if-no-files-found: error

  fast-contracts:
    name: Fast contracts & runner unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [governance-validate, release-ci-contract]
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install base dependencies
        run: python -m pip install --no-cache-dir --disable-pip-version-check -r requirements-base.txt

      - name: Run test runner unit suite
        run: python -m pytest tests/runner/ -v

      - name: Run fast contract tests
        run: python -m pytest tests/test_run_record.py tests/test_pipeline_job_schema.py tests/btc_icft/test_report_guardrails.py -v

      - name: Emit finite CI diagnostic
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: >
          python scripts/validate_release_ci_contract.py
          --diagnostic --workflow CI --job fast-contracts --step pytest
          --message "job status: ${JOB_STATUS}"
          --artifact-path outputs/ci_diagnostics/fast-contracts.json
          --json-out outputs/ci_diagnostics/fast-contracts.json

      - name: Upload fast-contracts diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-fast-contracts-diagnostic
          path: outputs/ci_diagnostics/fast-contracts.json
          if-no-files-found: error

  isolated-core-suite:
    name: "Core suite (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: fast-contracts
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install base dependencies
        run: python -m pip install --no-cache-dir --disable-pip-version-check -r requirements-base.txt

      - name: Run isolated core tests (no heavy optional dependencies)
        # Bounded worker processes, hard timeouts, thread caps, no external network
        run: >
          python scripts/run_tests_isolated.py
          --batch-size 1
          --timeout-s 120
          --report outputs/core_test_report_${{ matrix.python-version }}.json
          tests/test_run_record.py
          tests/test_run_records.py
          tests/test_topology.py
          tests/test_benchmarks_registry.py
          tests/test_transitions_governance.py
          tests/test_transitions_features.py
          tests/btc_icft/test_report_guardrails.py
          tests/btc_icft/test_ontology_schema.py
          tests/runner/test_runner_isolation.py

      - name: Smoke-test synthetic mode
        run: python main.py --mode synthetic

      - name: Emit finite CI diagnostic
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: >
          python scripts/validate_release_ci_contract.py
          --diagnostic --workflow CI --job isolated-core-suite --step isolated-tests
          --message "job status: ${JOB_STATUS}"
          --artifact-path outputs/ci_diagnostics/core-${{ matrix.python-version }}.json
          --json-out outputs/ci_diagnostics/core-${{ matrix.python-version }}.json

      - name: Upload core test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report-${{ matrix.python-version }}
          path: |
            outputs/core_test_report_*.json
            outputs/ci_diagnostics/core-${{ matrix.python-version }}.json
          if-no-files-found: error

  optional-eeg-suite:
    name: Optional EEG suite (Python 3.11)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' }}
    timeout-minutes: 45
    needs: fast-contracts
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install EEG profile dependencies
        run: python -m pip install --no-cache-dir --disable-pip-version-check -r requirements-eeg.txt

      - name: Run isolated EEG tests
        run: >
          python scripts/run_tests_isolated.py
          --batch-size 4
          --timeout-s 120
          --report outputs/eeg_test_report.json
          tests/test_connectivity_topology.py
          tests/btc_icft/test_eeg_mne_adapter.py
          tests/btc_icft/test_eeg_signal_blocks.py
          tests/test_preprocessing_artifact_rejection.py

      - name: Emit finite CI diagnostic
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: >
          python scripts/validate_release_ci_contract.py
          --diagnostic --workflow CI --job optional-eeg-suite --step pytest
          --message "job status: ${JOB_STATUS}"
          --artifact-path outputs/ci_diagnostics/eeg.json
          --json-out outputs/ci_diagnostics/eeg.json

      - name: Upload EEG test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eeg-test-report
          path: |
            outputs/eeg_test_report.json
            outputs/ci_diagnostics/eeg.json
          if-no-files-found: error

  optional-ml-suite:
    name: Optional ML suite (Python 3.11)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' }}
    timeout-minutes: 60
    needs: fast-contracts
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install ML profile dependencies
        run: python -m pip install --no-cache-dir --disable-pip-version-check -r requirements-ml.txt

      - name: Run isolated ML tests
        run: >
          python scripts/run_tests_isolated.py
          --batch-size 4
          --timeout-s 180
          --report outputs/ml_test_report.json
          tests/test_dual_engine.py

      - name: Emit finite CI diagnostic
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: >
          python scripts/validate_release_ci_contract.py
          --diagnostic --workflow CI --job optional-ml-suite --step pytest
          --message "job status: ${JOB_STATUS}"
          --artifact-path outputs/ci_diagnostics/ml.json
          --json-out outputs/ci_diagnostics/ml.json

      - name: Upload ML diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-ml-diagnostic
          path: |
            outputs/ml_test_report.json
            outputs/ci_diagnostics/ml.json
          if-no-files-found: error
