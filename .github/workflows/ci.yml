name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  MPLBACKEND: Agg
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  PIP_NO_CACHE_DIR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  governance-validate:
    name: Governance validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Prepare bounded pip temp directory
        run: |
          pip_tmp="${RUNNER_TEMP}/nts-pip-tmp"
          mkdir -p "$pip_tmp"
          echo "TMPDIR=$pip_tmp" >> "$GITHUB_ENV"

      - name: Install governance dependency only
        run: python -m pip install --no-cache-dir --disable-pip-version-check pyyaml

      - name: Validate governance specs
        run: python -m governance.validate

      - name: Clean package temporary files
        if: always()
        run: |
          if [ -n "${TMPDIR:-}" ] && [ -d "$TMPDIR" ]; then rm -rf -- "$TMPDIR"; fi

  dependency-inventory:
    name: Dependency profile audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify explicit profile boundaries
        run: |
          python - <<'PY'
          from pathlib import Path

          profiles = {
              "requirements-base.txt",
              "requirements-eeg.txt",
              "requirements-nwb.txt",
              "requirements-live.txt",
              "requirements-ml.txt",
              "requirements-research.txt",
              "requirements-quantum.txt",
              "requirements.txt",
          }
          for name in sorted(profiles):
              path = Path(name)
              if not path.is_file():
                  raise SystemExit(f"missing dependency profile: {name}")
              count = sum(
                  bool(line.strip()) and not line.lstrip().startswith("#")
                  for line in path.read_text().splitlines()
              )
              print(f"{name}: {count} declarations")

          base_lines = [
              line.strip().lower()
              for line in Path("requirements-base.txt").read_text().splitlines()
              if line.strip() and not line.lstrip().startswith("#")
          ]
          forbidden = ("torch", "nvidia", "cuda", "cupy", "tensorflow")
          violations = [line for line in base_lines if line.startswith(forbidden)]
          if violations:
              raise SystemExit(f"CPU/base profile contains GPU packages: {violations}")

          for name in sorted(profiles - {"requirements-base.txt", "requirements.txt"}):
              lines = Path(name).read_text().splitlines()
              if "-r requirements-base.txt" not in {line.strip() for line in lines}:
                  raise SystemExit(f"profile does not compose with requirements-base.txt: {name}")
          PY

  isolated-core-suite:
    name: "Core suite (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    needs: [governance-validate, dependency-inventory]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Prepare bounded pip temp directory
        run: |
          pip_tmp="${RUNNER_TEMP}/nts-pip-tmp"
          mkdir -p "$pip_tmp"
          echo "TMPDIR=$pip_tmp" >> "$GITHUB_ENV"

      - name: Install base dependencies
        run: python -m pip install --no-cache-dir -r requirements-base.txt

      - name: Run isolated core tests (no heavy optional dependencies)
        # Bounded worker processes, hard timeouts, thread caps, no external network
        run: >
          python scripts/run_tests_isolated.py
          --batch-size 1
          --timeout-s 120
          --report outputs/core_test_report_${{ matrix.python-version }}.json
          tests/test_run_record.py
          tests/test_run_records.py
          tests/test_topology.py
          tests/test_benchmarks_registry.py
          tests/test_transitions_governance.py
          tests/test_transitions_features.py
          tests/btc_icft/test_report_guardrails.py
          tests/btc_icft/test_ontology_schema.py
          tests/runner/test_runner_isolation.py

      - name: Smoke-test synthetic mode
        run: python main.py --mode synthetic

      - name: Capture core diagnostics
        if: failure()
        run: |
          {
            echo "## runner diagnostics"
            date -u
            df -h
            du -sh "$RUNNER_TEMP" . 2>/dev/null || true
          } | tee core-failure.txt

      - name: Clean package temporary files
        if: always()
        run: |
          if [ -n "${TMPDIR:-}" ] && [ -d "$TMPDIR" ]; then rm -rf -- "$TMPDIR"; fi

      - name: Upload core test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report-${{ matrix.python-version }}
          path: |
            outputs/core_test_report_*.json
            core-failure.txt

  optional-eeg-suite:
    name: Optional EEG suite (Python 3.11)
    runs-on: ubuntu-latest
    needs: [governance-validate, dependency-inventory]
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Prepare bounded pip temp directory
        run: |
          pip_tmp="${RUNNER_TEMP}/nts-pip-tmp"
          mkdir -p "$pip_tmp"
          echo "TMPDIR=$pip_tmp" >> "$GITHUB_ENV"

      - name: Install EEG profile dependencies
        run: python -m pip install --no-cache-dir -r requirements-eeg.txt

      - name: Detect changed MNE CSD reference paths
        id: mne_csd_reference_scope
        env:
          DIFF_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          DIFF_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if git diff --name-only "$DIFF_BASE_SHA...$DIFF_HEAD_SHA" | grep -Eq '^(tools/mne_csd_reference_audit/(kkt|legendre|montages|pin)\.py|tests/optional_live_mne/test_mne_csd_live_parity\.py)$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pin MNE for the independent CSD parity job
        if: steps.mne_csd_reference_scope.outputs.changed == 'true'
        run: python -m pip install --no-cache-dir --disable-pip-version-check "mne==1.13.2"

      - name: Run isolated EEG tests
        run: >
          python scripts/run_tests_isolated.py
          --batch-size 4
          --timeout-s 120
          --report outputs/eeg_test_report.json
          tests/test_connectivity_topology.py
          tests/btc_icft/test_eeg_mne_adapter.py
          tests/btc_icft/test_eeg_signal_blocks.py
          tests/test_preprocessing_artifact_rejection.py

      - name: Discover and run changed MNE signal-block tests
        env:
          DIFF_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          DIFF_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TESTED_CHECKOUT_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: >-
          python .github/workflows/round6_experimental_tests.py
          --diff-base "$DIFF_BASE_SHA"
          --diff-head "$DIFF_HEAD_SHA"
          --tested-checkout "$TESTED_CHECKOUT_SHA"
          --workflow-sha "$WORKFLOW_SHA"
          --event-name "$EVENT_NAME"
          --only-component mne_signal_blocks
          --pytest-marker requires_mne
          --report outputs/mne_signal_blocks_ci_report.json

      - name: Run changed MNE CSD adapter integration tests
        env:
          DIFF_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          DIFF_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TESTED_CHECKOUT_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: >-
          python .github/workflows/round6_experimental_tests.py
          --diff-base "$DIFF_BASE_SHA"
          --diff-head "$DIFF_HEAD_SHA"
          --tested-checkout "$TESTED_CHECKOUT_SHA"
          --workflow-sha "$WORKFLOW_SHA"
          --event-name "$EVENT_NAME"
          --only-component mne_csd_adapter
          --external-test-job optional-eeg-suite
          --report outputs/mne_csd_adapter_eeg_report.json

      - name: Run changed MNE CSD reference parity tests
        env:
          DIFF_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          DIFF_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TESTED_CHECKOUT_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: >-
          python .github/workflows/round6_experimental_tests.py
          --diff-base "$DIFF_BASE_SHA"
          --diff-head "$DIFF_HEAD_SHA"
          --tested-checkout "$TESTED_CHECKOUT_SHA"
          --workflow-sha "$WORKFLOW_SHA"
          --event-name "$EVENT_NAME"
          --only-component mne_csd_reference_audit
          --external-test-job optional-eeg-suite
          --report outputs/mne_csd_reference_audit_eeg_report.json

      - name: Capture EEG diagnostics
        if: failure()
        run: |
          {
            echo "## runner diagnostics"
            date -u
            df -h
            du -sh "$RUNNER_TEMP" . 2>/dev/null || true
          } | tee eeg-failure.txt

      - name: Clean package temporary files
        if: always()
        run: |
          if [ -n "${TMPDIR:-}" ] && [ -d "$TMPDIR" ]; then rm -rf -- "$TMPDIR"; fi

      - name: Upload EEG test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eeg-test-report
          path: |
            outputs/eeg_test_report.json
            outputs/mne_signal_blocks_ci_report.json
            outputs/mne_csd_adapter_eeg_report.json
            outputs/mne_csd_reference_audit_eeg_report.json
            outputs/round6-experimental-logs/**
            eeg-failure.txt
