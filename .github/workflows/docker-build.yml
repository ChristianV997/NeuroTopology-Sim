name: Docker build

# The automatic images are CPU/base and Awareness-only.  The aggregate root
# Dockerfile remains a manual opt-in because it installs every optional profile.
on:
  push:
    branches: ["**"]
    paths:
      - "Dockerfile"
      - "docker/ci/core.Dockerfile"
      - "requirements-base.txt"
      - "scripts/run_tests_isolated.py"
      - ".dockerignore"
      - "requirements.txt"
      - "apps/awareness_studio/Dockerfile"
      - "apps/awareness_studio/pyproject.toml"
      - ".github/workflows/docker-build.yml"
  pull_request:
    branches: ["**"]
    paths:
      - "Dockerfile"
      - "docker/ci/core.Dockerfile"
      - "requirements-base.txt"
      - "scripts/run_tests_isolated.py"
      - ".dockerignore"
      - "requirements.txt"
      - "apps/awareness_studio/Dockerfile"
      - "apps/awareness_studio/pyproject.toml"
      - ".github/workflows/docker-build.yml"
  workflow_dispatch:
    inputs:
      run_full_root:
        description: "Build the aggregate production root image (manual opt-in)"
        required: false
        type: boolean
        default: false

jobs:
  root-sim-engine:
    name: Root sim engine CPU/base image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build --progress=plain -f docker/ci/core.Dockerfile -t neurotopology-sim:core-cpu .

      - name: Run test suite inside container
        run: docker run --rm neurotopology-sim:core-cpu

      - name: Emit finite Docker diagnostic
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: >
          python scripts/validate_release_ci_contract.py
          --diagnostic --workflow "Docker build" --job root-sim-engine --step docker
          --message "job status: ${JOB_STATUS}"
          --artifact-path outputs/ci_diagnostics/docker-core.json
          --json-out outputs/ci_diagnostics/docker-core.json

      - name: Upload CPU image diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-core-ci-diagnostic
          path: outputs/ci_diagnostics/docker-core.json
          if-no-files-found: error

  awareness-studio:
    name: Awareness Studio image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t awareness-studio:latest -f apps/awareness_studio/Dockerfile apps/awareness_studio

      - name: Run test suite inside container
        run: docker run --rm awareness-studio:latest

      - name: Emit finite Docker diagnostic
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: >
          python scripts/validate_release_ci_contract.py
          --diagnostic --workflow "Docker build" --job awareness-studio --step docker
          --message "job status: ${JOB_STATUS}"
          --artifact-path outputs/ci_diagnostics/docker-awareness.json
          --json-out outputs/ci_diagnostics/docker-awareness.json

      - name: Upload Awareness image diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-awareness-ci-diagnostic
          path: outputs/ci_diagnostics/docker-awareness.json
          if-no-files-found: error

  production-root-image:
    name: Production root image (manual opt-in)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_full_root == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Build production root image
        run: docker build --progress=plain -f Dockerfile -t neurotopology-sim:production-root .

      - name: Run production root test suite inside container
        run: docker run --rm neurotopology-sim:production-root

      - name: Emit finite Docker diagnostic
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: >
          python scripts/validate_release_ci_contract.py
          --diagnostic --workflow "Docker build" --job production-root-image --step docker
          --message "job status: ${JOB_STATUS}"
          --artifact-path outputs/ci_diagnostics/docker-production.json
          --json-out outputs/ci_diagnostics/docker-production.json

      - name: Upload production image diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-production-ci-diagnostic
          path: outputs/ci_diagnostics/docker-production.json
          if-no-files-found: error
