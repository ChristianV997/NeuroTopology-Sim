name: Ontology Claim Language

on:
  pull_request:
  workflow_dispatch:

jobs:
  ontology-claim-language:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      PIP_NO_CACHE_DIR: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --no-cache-dir --disable-pip-version-check -r requirements-base.txt
      - name: Run claim-language validator
        run: |
          python tools/validate_ontology_claim_language.py --root . --scan-mode repo --baseline contracts/btc_icft/ontology_claims/claim_language_baseline.json --json-out outputs/btc_icft/ontology_claim_language_validation.json --markdown-out outputs/btc_icft/ontology_claim_language_validation.md
      - name: Upload validator report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ontology-claim-language-report
          path: |
            outputs/btc_icft/ontology_claim_language_validation.json
            outputs/btc_icft/ontology_claim_language_validation.md
            outputs/ci_diagnostics/ontology.json
          if-no-files-found: warn

      - name: Emit finite ontology diagnostic
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: >
          python scripts/validate_release_ci_contract.py
          --diagnostic --workflow "Ontology Claim Language"
          --job ontology-claim-language --step validator
          --message "job status: ${JOB_STATUS}"
          --artifact-path outputs/ci_diagnostics/ontology.json
          --json-out outputs/ci_diagnostics/ontology.json

      - name: Upload finite ontology diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ontology-ci-diagnostic
          path: outputs/ci_diagnostics/ontology.json
          if-no-files-found: error
