name: SU2 Lorentzian dynamics

on:
  pull_request:
    paths:
      - 'field_theory/su2/**'
      - 'tests/test_su2_lorentzian.py'
      - 'docs/su2_lorentzian_dynamics.md'
      - '.github/workflows/su2-lorentzian.yml'
  push:
    branches: [main]
    paths:
      - 'field_theory/su2/**'
      - 'tests/test_su2_lorentzian.py'
      - 'docs/su2_lorentzian_dynamics.md'
      - '.github/workflows/su2-lorentzian.yml'

permissions:
  contents: read

jobs:
  lorentzian-dynamics-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install focused test dependencies
        run: python -m pip install 'numpy>=1.24.0' 'pytest>=7.0.0' 'pytest-timeout>=2.3'
      - name: Run Lorentzian dynamics tests
        run: python -m pytest tests/test_su2_lorentzian.py -q -p no:cacheprovider
