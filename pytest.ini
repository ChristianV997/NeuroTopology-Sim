[pytest]
addopts = --import-mode=importlib --ignore=apps/awareness_studio -p no:warnings --strict-config
required_plugins = pytest-timeout>=2.3
timeout = 300
timeout_method = thread

# Registered test markers for resource-bounded and profile-aware execution
markers =
    slow: Tests with wall-clock execution time > 5 seconds.
    native: Tests invoking compiled C/C++, Fortran, or Rust native extensions.
    memory_heavy: Tests with peak memory footprint exceeding 500 MB.
    serial: Tests that mutate global state or cannot run concurrently.
    network: Tests requiring external network communication (strictly disabled in normal CI).
    requires_mne: Tests requiring MNE-Python or the MNE electrophysiology ecosystem.
    requires_torch: Tests requiring PyTorch or PyTorch Geometric.
    requires_nwb: Tests requiring PyNWB or DANDI remote streaming.
    requires_live_hardware: Tests requiring live hardware sensor connectivity or physical probes.

# apps/awareness_studio is an independently installable sub-project with its own
# pyproject.toml and its own tools/ package. Collecting it from the root suite binds
# the top-level `tools` module identity to apps/awareness_studio/tools (whichever
# collects first alphabetically), breaking every `from tools.<root_submodule> import`
# in the rest of the suite. Run its tests separately: cd apps/awareness_studio && pytest
