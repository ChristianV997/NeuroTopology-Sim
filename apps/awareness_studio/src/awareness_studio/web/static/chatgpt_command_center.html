<div id="app">Loading empirical Command Centre...</div>
<style>
  :root{font-family:Inter,system-ui,sans-serif;color:#e8edf4;background:#10151d}body{margin:0}.wrap{padding:16px}.header{display:flex;justify-content:space-between;gap:12px;align-items:baseline}.title{font-size:16px;font-weight:700}.note{font-size:12px;color:#aab6c6}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:14px 0}.card{background:#18212c;border:1px solid #2b3a4c;padding:10px;border-radius:6px}.k{font-size:11px;color:#aab6c6;text-transform:uppercase}.v{font:600 14px ui-monospace,monospace;margin-top:5px}.row{display:grid;grid-template-columns:72px 1fr 1fr;gap:8px;padding:9px 0;border-top:1px solid #2b3a4c;font-size:12px}.mono{font-family:ui-monospace,monospace}.warn{border-left:3px solid #e6aa46;background:#211d17;padding:9px;font-size:12px;line-height:1.4}@media(max-width:520px){.grid{grid-template-columns:1fr}.row{grid-template-columns:62px 1fr}}
</style>
<script>
const root=document.getElementById('app');
function render(data){const states=data.state_summaries||[],quality=data.data_quality||{};const exp=v=>Number.isFinite(Number(v))?Number(v).toExponential(3):'n/a';root.innerHTML=`<div class="wrap"><div class="header"><div class="title">NeuroTopology Command Centre</div><div class="note">${data.dataset||'No dataset'} · ${data.status||'unavailable'}</div></div><div class="grid"><div class="card"><div class="k">Subjects</div><div class="v">${quality.subject_count??'n/a'}</div><div class="note">completed empirical participants</div></div><div class="card"><div class="k">Windows</div><div class="v">${quality.window_count??'n/a'}</div><div class="note">Level T telemetry</div></div><div class="card"><div class="k">Warnings</div><div class="v">${quality.warning_window_count??'n/a'}</div><div class="note">source telemetry warnings</div></div></div>${states.map(s=>`<div class="row"><strong class="mono">${s.task_label}</strong><span>q ${exp(s.q_net_mean)}</span><span>f ${exp(s.f_dress_mean)}</span></div>`).join('')}<div class="warn">${data.spatial_artifact?.reason||'Spatial artifact unavailable.'} Metrics are empirical proxies, not clinical or physical proof. ${data.guardrails?.pipeline_execution==='blocked_from_ui'?'Pipeline execution is blocked in this interface.':''}</div></div>`}
function update(result){render(result?.structuredContent||result||window.openai?.toolOutput||{})}
window.addEventListener('message',event=>{const m=event.data;if(m?.jsonrpc==='2.0'&&m.method==='ui/notifications/tool-result')update(m.params)},{passive:true});
update(window.openai?.toolOutput);
</script>
