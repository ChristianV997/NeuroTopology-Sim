<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NeuroTopology Command Centre</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <style>
    :root{--bg:#10151c;--nav:#121a23;--surface:#17212b;--surface2:#1d2935;--line:#2c3b49;--ink:#eaf0f6;--muted:#9aabba;--cyan:#67cfd7;--mint:#76c99b;--amber:#e2b66b;--red:#e17b7b;--mono:'JetBrains Mono',monospace;--font:Inter,system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px}.app{min-height:100vh;display:grid;grid-template-columns:244px minmax(0,1fr)}.nav{background:var(--nav);border-right:1px solid var(--line);padding:20px 12px;display:flex;flex-direction:column;gap:24px}.eyebrow{display:block;color:var(--cyan);font:600 10px var(--mono);letter-spacing:1px;text-transform:uppercase}.brand{padding:0 8px}.brand strong{display:block;font-size:17px;margin-top:7px}.brand span{display:block;color:var(--muted);font-size:12px;margin-top:5px}.nav-group{display:grid;gap:3px}.nav-label{padding:0 8px 7px;color:#73889a;font:600 10px var(--mono);letter-spacing:1px;text-transform:uppercase}.nav button{border:0;border-left:2px solid transparent;background:transparent;color:#aab8c5;text-align:left;padding:9px 10px;font:500 13px var(--font);cursor:pointer}.nav button:hover,.nav button.active{background:#1c2935;color:var(--ink);border-left-color:var(--cyan)}.nav-foot{margin-top:auto;border-top:1px solid var(--line);padding:12px 8px 2px;color:var(--muted);font-size:11px;line-height:1.5}.main{min-width:0}.topbar{min-height:72px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:13px 28px;gap:16px}.crumb{color:var(--muted);font:11px var(--mono);letter-spacing:.5px;text-transform:uppercase}.topbar h1{font-size:18px;margin:4px 0 0}.top-actions{display:flex;gap:9px;align-items:center}.source-state{border:1px solid #315b65;background:#14292e;color:#b9eef0;padding:6px 9px;font:10px var(--mono);letter-spacing:.4px}button.action{border:1px solid #3d6770;background:#1b3940;color:#d8f7f5;padding:8px 11px;font:600 12px var(--font);cursor:pointer}button.action:hover{background:#25515a}.content{max-width:1560px;margin:auto;padding:26px 28px 44px}.view{display:none}.view.active{display:block}.view-head{display:flex;justify-content:space-between;gap:16px;align-items:end;margin-bottom:20px}.view-head h2{font-size:22px;margin:0}.view-head p{color:var(--muted);margin:7px 0 0;line-height:1.5}.stamp{font:11px var(--mono);color:var(--muted);white-space:nowrap}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);margin-bottom:19px}.metric{min-width:0;padding:15px 17px;border-right:1px solid var(--line)}.metric:last-child{border:0}.k{color:var(--muted);font:10px var(--mono);letter-spacing:.75px;text-transform:uppercase}.v{font:600 25px var(--mono);margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{color:var(--muted);font-size:11px;margin-top:6px;line-height:1.35}.grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(330px,.8fr);gap:18px}.section{border-top:1px solid var(--line);padding-top:13px}.section h3{font-size:13px;margin:0 0 12px}.section h3 span{font-size:11px;color:var(--muted);font-weight:400;margin-left:6px}.plot{height:330px;background:var(--surface)}.state-list{display:grid;gap:8px}.state-row{display:grid;grid-template-columns:76px 1fr 1fr 90px;gap:9px;align-items:center;background:var(--surface);border:1px solid var(--line);padding:11px}.state-name{font:600 12px var(--mono);text-transform:uppercase}.state-value{font:12px var(--mono)}.state-value span{display:block;color:var(--muted);font:10px var(--font);margin-bottom:3px}.state-count{color:var(--muted);font:11px var(--mono);text-align:right}.notice{margin-top:18px;border-left:3px solid var(--amber);background:#231f18;padding:12px 14px;color:#d8d1be;line-height:1.5;font-size:12px}.notice strong{color:#f3d89f}.table-wrap{border:1px solid var(--line);overflow:auto;background:var(--surface)}table{width:100%;border-collapse:collapse;min-width:720px}th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}th{background:#1b2732;color:#a9bac8;font:600 10px var(--mono);letter-spacing:.7px;text-transform:uppercase}td{font-size:12px}tr:last-child td{border:0}.mono{font-family:var(--mono)}.muted{color:var(--muted)}.tag{display:inline-block;border:1px solid #35616d;background:#142a31;color:#b6ebed;padding:3px 6px;font:10px var(--mono)}.tag.warn{border-color:#785c30;background:#2b2315;color:#f0ce91}.link{border:0;background:none;color:#96e0e2;padding:0;font:600 12px var(--font);cursor:pointer;text-decoration:underline;text-underline-offset:3px}.command-list{display:grid;gap:8px}.command{display:grid;grid-template-columns:minmax(190px,.7fr) minmax(160px,1.4fr) auto;gap:16px;align-items:center;border:1px solid var(--line);background:var(--surface);padding:13px 14px}.command strong{font-size:13px}.command code{color:var(--muted);font:11px var(--mono);overflow-wrap:anywhere}.subject-layout{display:grid;grid-template-columns:minmax(235px,.35fr) minmax(0,1fr);gap:18px}.subject-list{border:1px solid var(--line);background:var(--surface);max-height:610px;overflow:auto}.subject-option{display:grid;grid-template-columns:1fr auto;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);padding:12px;width:100%;text-align:left;cursor:pointer}.subject-option:hover,.subject-option.active{background:#20313e}.subject-option:last-child{border-bottom:0}.subject-option .id{font:600 12px var(--mono)}.subject-option .meta{color:var(--muted);font-size:11px;margin-top:4px}.subject-option .wins{color:var(--cyan);font:11px var(--mono)}.detail-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:13px}.detail-head h3{margin:0;font-size:15px}.detail-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);margin-bottom:18px}.detail{padding:12px;border-right:1px solid var(--line)}.detail:last-child{border:0}.detail .value{font:600 16px var(--mono);margin-top:6px}.quality{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,.8fr);gap:18px}.quality-row{display:grid;grid-template-columns:110px 1fr 68px;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:11px 0}.quality-row:last-child{border:0}.bar{height:7px;background:#23313e;overflow:hidden}.bar>span{display:block;height:100%;background:var(--mint)}.error,.loading{border:1px solid var(--line);background:var(--surface);padding:20px;color:var(--muted)}.error{border-left:3px solid var(--red);color:#f0c3c3}@media(max-width:1030px){.app{grid-template-columns:1fr}.nav{display:none}.content{padding:20px}.grid,.quality,.subject-layout{grid-template-columns:1fr}}@media(max-width:620px){.topbar{padding:13px 16px}.content{padding:17px}.source-state{display:none}.view-head{align-items:start;flex-direction:column}.metrics{grid-template-columns:1fr}.metric{border-right:0;border-bottom:1px solid var(--line)}.metric:last-child{border-bottom:0}.state-row{grid-template-columns:70px 1fr}.state-count{text-align:left}.detail-grid{grid-template-columns:1fr}.detail{border-right:0;border-bottom:1px solid var(--line)}.detail:last-child{border-bottom:0}.command{grid-template-columns:1fr;gap:8px}}
  </style>
</head>
<body>
  <div class="app">
    <nav class="nav" aria-label="Command Centre">
      <div class="brand"><small class="eyebrow">Awareness Studio</small><strong>NeuroTopology</strong><span>Empirical Command Centre</span></div>
      <div class="nav-group"><div class="nav-label">Workspace</div><button class="active" data-view="overview">Overview</button><button data-view="subjects">Subject explorer</button><button data-view="quality">Data quality</button><button data-view="datasets">Dataset registry</button><button data-view="artifacts">Artifact registry</button><button data-view="commands">Command registry</button><button data-view="guardrails">Evidence &amp; guardrails</button></div>
      <div class="nav-group"><div class="nav-label">Explore</div><button data-action="cortex">Cortex playback</button><button data-action="vortex-field">Vortex field (ds005620)</button><button data-action="discovery">Dataset candidates</button><button data-action="studio">Research workspace</button></div>
      <div class="nav-foot">Read-only interface.<br>Dataset runs and downloads are blocked here.</div>
    </nav>
    <main class="main"><header class="topbar"><div><div class="crumb">Empirical results / ds005620</div><h1>Command Centre</h1></div><div class="top-actions"><span class="source-state" id="source-state">LOADING REAL ARTIFACTS</span><button class="action" id="refresh">Refresh</button></div></header><div class="content" id="root"><div class="loading">Loading empirical run registry...</div></div></main>
  </div>
  <script>
    'use strict';
    const root=document.getElementById('root'),sourceState=document.getElementById('source-state');let status,registry,activeView='overview',selectedSubject='';
    const esc=value=>String(value??'').replace(/[&<>"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[char]));
    const sci=value=>Number.isFinite(Number(value))?Number(value).toExponential(3):'n/a';
    const whole=value=>Number(value||0).toLocaleString();
    const stateColor={awake:'#67cfd7',sed:'#76c99b',sed2:'#e2b66b'};
    function metrics(data){const q=data.data_quality||{};const manifest=data.manifest||{};return `<div class="metrics"><div class="metric"><div class="k">Participants completed</div><div class="v">${whole(q.subject_count)}</div><div class="sub">${whole(Object.keys(manifest.failed_subjects||{}).length)} failed subjects</div></div><div class="metric"><div class="k">Telemetry windows</div><div class="v">${whole(q.window_count)}</div><div class="sub">Level T rows with q_net and f_dress</div></div><div class="metric"><div class="k">Level T artifacts</div><div class="v">${whole(q.level_t_artifact_count)}</div><div class="sub">One source file per completed subject</div></div><div class="metric"><div class="k">Warning windows</div><div class="v">${whole(q.warning_window_count)}</div><div class="sub">Raw warnings preserved in source telemetry</div></div></div>`}
    function overview(){const data=status.real_results,states=data.state_summaries||[];return `<section class="view active"><div class="view-head"><div><h2>Propofol EEG empirical run</h2><p>Observed Level T telemetry from the completed ds005620 run. Values retain their proxy labels and claim boundaries.</p></div><span class="stamp">${esc(data.schema_version)}</span></div>${metrics(data)}<div class="grid"><section class="section"><h3>Topology-friction phase space <span>state means</span></h3><div id="phase-plot" class="plot"></div></section><section class="section"><h3>State telemetry <span>window mean</span></h3><div class="state-list">${states.map(s=>`<article class="state-row"><div class="state-name">${esc(s.task_label)}</div><div class="state-value"><span>q_net proxy</span>${sci(s.q_net_mean)}</div><div class="state-value"><span>f_dress proxy</span>${sci(s.f_dress_mean)}</div><div class="state-count">${whole(s.window_count)} windows<br>${whole(s.subject_count)} subjects</div></article>`).join('')}</div></section></div><aside class="notice"><strong>Evidence gate.</strong> ${esc(data.spatial_artifact?.reason||'Spatial artifact unavailable.')} q_net and f_dress are pipeline-specific proxies, not validated clinical markers, conserved physical quantities, or proof of consciousness claims.</aside></section>`}
    function subjects(){const rows=status.real_results.subject_summaries||[];if(!selectedSubject&&rows.length)selectedSubject=rows[0].subject_id;const current=rows.find(row=>row.subject_id===selectedSubject)||rows[0];return `<section class="view active"><div class="view-head"><div><h2>Subject explorer</h2><p>Within-run telemetry summaries. Select a subject to inspect its actual task coverage.</p></div><span class="stamp">${whole(rows.length)} empirical subjects</span></div><div class="subject-layout"><aside class="subject-list" aria-label="Subjects">${rows.map(row=>`<button class="subject-option ${row.subject_id===current.subject_id?'active':''}" data-subject="${esc(row.subject_id)}"><span><span class="id">${esc(row.subject_id)}</span><span class="meta">quality ${sci(row.topology_quality_mean)} · ${whole(row.warning_count)} warnings</span></span><span class="wins">${whole(row.window_count)}</span></button>`).join('')}</aside><section><div class="detail-head"><div><h3>${esc(current.subject_id)}</h3><div class="muted" style="margin-top:5px;font-size:12px">${whole(current.window_count)} windows across ${whole(current.states.length)} observed states</div></div><span class="tag">empirical telemetry</span></div><div class="detail-grid"><div class="detail"><div class="k">q_net proxy</div><div class="value">${sci(current.q_net_mean)}</div></div><div class="detail"><div class="k">f_dress proxy</div><div class="value">${sci(current.f_dress_mean)}</div></div><div class="detail"><div class="k">defect density</div><div class="value">${sci(current.defect_density_mean)}</div></div></div><section class="section"><h3>State trajectory <span>subject window means</span></h3><div id="subject-plot" class="plot"></div></section></section></div></section>`}
    function quality(){const data=status.real_results,states=data.state_summaries||[];return `<section class="view active"><div class="view-head"><div><h2>Data quality</h2><p>Coverage and topology-quality telemetry retained from the real processing artifacts.</p></div><span class="stamp">no imputation</span></div>${metrics(data)}<div class="quality"><section class="section"><h3>Mean topology quality <span>by task</span></h3><div>${states.map(s=>`<div class="quality-row"><span class="mono">${esc(s.task_label)}</span><div class="bar"><span style="width:${Math.max(0,Math.min(100,(s.topology_quality_mean||0)*100))}%;background:${stateColor[s.task_label]||'#67cfd7'}"></span></div><span class="mono">${sci(s.topology_quality_mean)}</span></div>`).join('')}</div></section><section class="section"><h3>Defect-density distribution <span>subject means</span></h3><div id="quality-plot" class="plot"></div></section></div><aside class="notice"><strong>Scope gate.</strong> Quality is a pipeline telemetry field. It reports valid-triangle coverage from the current Level T method and is not an independent EEG clinical-quality score.</aside></section>`}
    function datasets(){return `<section class="view active"><div class="view-head"><div><h2>Dataset registry</h2><p>Completed empirical datasets available to this Command Centre.</p></div></div><div class="table-wrap"><table><thead><tr><th>Accession</th><th>Run</th><th>Completion</th><th>Windows</th><th>States</th><th>Evidence</th></tr></thead><tbody>${registry.dataset_registry.map(d=>`<tr><td class="mono">${esc(d.accession)}</td><td>${esc(d.label)}</td><td><span class="tag">${esc(d.status)}</span><br><span class="muted">${whole(d.participant_count)} completed · ${whole(d.failed_subject_count)} failed</span></td><td class="mono">${whole(d.window_count)}</td><td class="mono">${esc(d.state_order.join(' → '))}</td><td>${esc(d.evidence_state)}</td></tr>`).join('')}</tbody></table></div></section>`}
    function artifacts(){return `<section class="view active"><div class="view-head"><div><h2>Artifact registry</h2><p>Allowlisted results generated by the completed full-dataset run.</p></div></div><div class="table-wrap"><table><thead><tr><th>Artifact</th><th>Type</th><th>Description</th><th>Access</th></tr></thead><tbody>${registry.artifact_registry.map(a=>`<tr><td class="mono">${esc(a.name)}</td><td><span class="tag ${a.downloadable?'':'warn'}">${esc(a.kind)}</span></td><td class="muted">${esc(a.description)}</td><td>${a.downloadable?`<a class="link" href="/command-center/artifacts/${encodeURIComponent(a.id)}">Download</a>`:'<span class="muted">API only</span>'}</td></tr>`).join('')}</tbody></table></div></section>`}
    function commands(){return `<section class="view active"><div class="view-head"><div><h2>Command registry</h2><p>Declared integrations and operator entry points. This interface does not execute datasets or pipelines.</p></div></div><div class="command-list">${registry.command_registry.map(c=>`<article class="command"><div><strong>${esc(c.label)}</strong><div class="muted mono" style="margin-top:4px">${esc(c.kind)}</div></div><code>${esc(c.endpoint)}</code><button class="action" data-command="${esc(c.id)}">Open</button></article>`).join('')}</div><aside class="notice"><strong>Execution policy.</strong> Dataset discovery returns candidates to verify only. Pipeline runs, downloads, and local OSC replay remain explicit operator actions outside the web UI.</aside></section>`}
    function guardrails(){const gates=registry.guardrails||{};const spatial=gates.spatial_data||{};return `<section class="view active"><div class="view-head"><div><h2>Evidence &amp; guardrails</h2><p>Interpretation and operation boundaries supplied with the empirical artifact registry.</p></div><span class="stamp">policy enforced by API and UI</span></div><div class="table-wrap"><table><thead><tr><th>Control</th><th>Current state</th><th>Operational meaning</th></tr></thead><tbody><tr><td class="mono">pipeline_execution</td><td><span class="tag warn">${esc(gates.pipeline_execution)}</span></td><td>Dashboard actions cannot launch a pipeline run or dataset download.</td></tr><tr><td class="mono">dataset_discovery</td><td><span class="tag warn">${esc(gates.dataset_discovery)}</span></td><td>EEGDash returns candidate accessions for review only.</td></tr><tr><td class="mono">metric_interpretation</td><td><span class="tag warn">${esc(gates.metric_interpretation)}</span></td><td>Telemetry is research-facing and cannot be represented as clinical or physical proof.</td></tr><tr><td class="mono">spatial_data</td><td><span class="tag warn">${esc(spatial.status||'unavailable')}</span></td><td>${esc(spatial.reason||'No spatial artifact is registered.')}</td></tr></tbody></table></div><aside class="notice"><strong>Review boundary.</strong> The 3D cortex page can replay the real scalar windows, but it must remain visually and semantically separate from an anatomical defect-localization claim until phase, coordinates, defects, and wave vectors are produced by the pipeline.</aside></section>`}
    function plot(target,traces,layout){Plotly.newPlot(target,traces,{paper_bgcolor:'#17212b',plot_bgcolor:'#17212b',margin:{l:64,r:18,t:20,b:54},font:{family:'Inter, sans-serif',color:'#a9bac9'},...layout},{displayModeBar:false,responsive:true})}
    function drawOverview(){const s=status.real_results.state_summaries||[];plot('phase-plot',[{x:s.map(x=>x.q_net_mean),y:s.map(x=>x.f_dress_mean),text:s.map(x=>x.task_label),mode:'lines+markers+text',textposition:'top center',textfont:{color:'#eaf0f6'},line:{color:'#67cfd7',width:2},marker:{size:11,color:s.map(x=>stateColor[x.task_label]||'#67cfd7')}}],{xaxis:{title:'q_net proxy',gridcolor:'#2b3d4b'},yaxis:{title:'f_dress proxy',gridcolor:'#2b3d4b'}})}
    function drawSubject(){const row=(status.real_results.subject_summaries||[]).find(x=>x.subject_id===selectedSubject);if(!row)return;plot('subject-plot',[{x:row.states.map(x=>x.task_label),y:row.states.map(x=>x.q_net_mean),name:'q_net proxy',type:'bar',marker:{color:'#67cfd7'}},{x:row.states.map(x=>x.task_label),y:row.states.map(x=>x.f_dress_mean),name:'f_dress proxy',type:'bar',marker:{color:'#e2b66b'}}],{barmode:'group',yaxis:{title:'proxy value',gridcolor:'#2b3d4b'},legend:{orientation:'h',y:1.18}})}
    function drawQuality(){const rows=status.real_results.subject_summaries||[];plot('quality-plot',[{x:rows.map(x=>x.subject_id),y:rows.map(x=>x.defect_density_mean),type:'bar',marker:{color:rows.map(x=>x.topology_quality_mean>=.95?'#76c99b':'#e2b66b')},hovertemplate:'%{x}<br>defect density %{y:.3e}<extra></extra>'}],{xaxis:{showticklabels:false,gridcolor:'#2b3d4b'},yaxis:{title:'defect density proxy',gridcolor:'#2b3d4b'}})}
    function render(){if(!status||status.data_mode!=='real'||status.real_results?.status!=='available'){root.innerHTML='<div class="error">Empirical results are not available. The Command Centre will not substitute mock data.</div>';sourceState.textContent='REAL DATA UNAVAILABLE';return}const pages={overview,subjects,quality,datasets,artifacts,commands,guardrails};root.innerHTML=pages[activeView]();sourceState.textContent='REAL ARTIFACTS · READ ONLY';if(activeView==='overview')drawOverview();if(activeView==='subjects'){drawSubject();document.querySelectorAll('[data-subject]').forEach(button=>button.addEventListener('click',()=>{selectedSubject=button.dataset.subject;render()}))}if(activeView==='quality')drawQuality();document.querySelectorAll('[data-command]').forEach(button=>button.addEventListener('click',()=>dispatch(button.dataset.command)))}
    function dispatch(command){if(command==='refresh-empirical-status')return load();if(command==='open-cortex-viewer'||command==='cortex')return window.open('/cortex','_blank','noopener');if(command==='vortex-field')return window.open('/vortex-field','_blank','noopener');if(command==='dataset-candidates'||command==='discovery'||command==='studio')return window.location.assign('/');if(command==='export-osc-replay')alert('Local replay is deliberately not launched from the web interface. Use the repository broadcaster after reviewing the run artifacts.')}
    async function load(){root.innerHTML='<div class="loading">Refreshing real artifacts...</div>';try{const [a,b]=await Promise.all([fetch('/command-center/status'),fetch('/command-center/registry')]);if(!a.ok||!b.ok)throw new Error('Command Centre API unavailable');status=await a.json();registry=await b.json();render()}catch(error){sourceState.textContent='CONNECTION ERROR';root.innerHTML=`<div class="error">Could not load the empirical registry: ${esc(error.message)}</div>`}}
    document.querySelectorAll('[data-view]').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('[data-view]').forEach(item=>item.classList.remove('active'));button.classList.add('active');activeView=button.dataset.view;render()}));document.querySelectorAll('[data-action]').forEach(button=>button.addEventListener('click',()=>dispatch(button.dataset.action)));document.getElementById('refresh').addEventListener('click',load);load();
  </script>
</body>
</html>
