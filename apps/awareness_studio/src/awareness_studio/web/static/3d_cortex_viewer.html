<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NeuroTopology Cortex Viewer</title>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; background:#11151c; color:#e8edf4; }
    body { margin:0; min-height:100vh; display:grid; grid-template-rows:auto 1fr; }
    header { padding:12px 18px; border-bottom:1px solid #2d3542; display:flex; gap:14px; align-items:center; }
    header strong { font-size:15px; } header span { font-size:12px; color:#aeb8c7; }
    #layout { min-height:0; display:grid; grid-template-columns:minmax(0, 1.3fr) minmax(300px, .7fr); }
    #scene { min-height:500px; position:relative; } #plot { min-height:260px; }
    #side { border-left:1px solid #2d3542; padding:16px; overflow:auto; }
    .notice { background:#1d2631; border-left:3px solid #e0a843; padding:10px; font-size:13px; line-height:1.4; }
    dl { display:grid; grid-template-columns:auto 1fr; gap:8px 12px; font-size:13px; } dt { color:#aeb8c7; } dd { margin:0; font-family:ui-monospace, monospace; }
    input { width:100%; } button { margin-top:12px; background:#50a8e5; border:0; border-radius:4px; padding:8px 12px; color:#07121a; font-weight:700; cursor:pointer; }
    @media (max-width: 760px) { #layout { grid-template-columns:1fr; } #side { border-left:0; border-top:1px solid #2d3542; } #scene { min-height:400px; } }
  </style>
</head>
<body>
  <header><strong>NeuroTopology Cortex Viewer</strong><span id="status">Loading empirical telemetry...</span><a href="/vortex-field" style="margin-left:auto;color:#50a8e5;font-size:12px;text-decoration:none">Real vortex-defect field (ds005620) →</a></header>
  <div id="layout">
    <div id="scene"></div>
    <section id="side">
      <div class="notice" id="notice"></div>
      <h2 style="font-size:14px;margin-top:18px">Playback</h2>
      <input id="frame" type="range" min="0" max="0" value="0" aria-label="Telemetry frame">
      <button id="play" type="button">Play</button>
      <dl id="metrics"></dl>
      <div id="plot"></div>
      <h2 style="font-size:14px;margin-top:18px">H1 persistence (real, per-subject)</h2>
      <div class="notice" id="persistence-notice"></div>
      <select id="persistence-subject" style="width:100%;margin-top:8px;display:none"></select>
      <div id="persistence-plot" style="display:none"></div>
      <dl id="persistence-metrics"></dl>
    </section>
  </div>
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.166.1/build/three.module.js"}}</script>
  <script type="module">
    import * as THREE from 'three';

    const sceneHost = document.getElementById('scene');
    const slider = document.getElementById('frame');
    const notice = document.getElementById('notice');
    const metrics = document.getElementById('metrics');
    const status = document.getElementById('status');
    const renderer = new THREE.WebGLRenderer({ antialias:true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    sceneHost.appendChild(renderer.domElement);
    const scene = new THREE.Scene(); scene.background = new THREE.Color('#11151c');
    const camera = new THREE.PerspectiveCamera(40, 1, .1, 100); camera.position.set(0, 0, 8);
    scene.add(new THREE.AmbientLight(0xffffff, .8));
    const lamp = new THREE.DirectionalLight(0xb9dfff, 1.2); lamp.position.set(2, 3, 4); scene.add(lamp);
    const group = new THREE.Group(); scene.add(group);
    const material = new THREE.MeshStandardMaterial({ color:0x2d6e9f, roughness:.65, metalness:.05, transparent:true, opacity:.92 });
    const geometry = new THREE.IcosahedronGeometry(1.55, 3); geometry.scale(.82, 1, .72);
    const left = new THREE.Mesh(geometry, material.clone()); left.position.x=-.72; group.add(left);
    const right = new THREE.Mesh(geometry, material.clone()); right.position.x=.72; group.add(right);
    const marker = new THREE.Mesh(new THREE.SphereGeometry(.13, 18, 12), new THREE.MeshBasicMaterial({color:0xffb44c})); marker.position.set(0, .95, .25); group.add(marker);
    const marker2 = marker.clone(); marker2.position.set(-.7, -.5, .8); group.add(marker2);
    const clock = new THREE.Clock(); let payload; let playing=false;

    function resize() { const w=sceneHost.clientWidth, h=sceneHost.clientHeight; renderer.setSize(w,h); camera.aspect=w/h; camera.updateProjectionMatrix(); }
    window.addEventListener('resize', resize); resize();
    function render() { requestAnimationFrame(render); const t=clock.getElapsedTime(); group.rotation.y = t*.12; renderer.render(scene,camera); } render();
    function format(value) { return Number.isFinite(value) ? value.toExponential(3) : 'n/a'; }
    function update(index) {
      const frame = payload.frames[index] || {}; const intensity = Math.min(1, Math.max(0, Math.abs(frame.f_dress || 0) * 1000));
      const color = new THREE.Color().setHSL(.58 - intensity*.52, .62, .36 + intensity*.22); left.material.color.copy(color); right.material.color.copy(color);
      marker.position.x = ((frame.q_net || 0) * 1000) % 1.2 - .6;
      metrics.innerHTML = `<dt>subject</dt><dd>${frame.subject_id || 'n/a'}</dd><dt>state</dt><dd>${frame.task_label || 'n/a'}</dd><dt>window</dt><dd>${frame.window_start_s ?? 'n/a'} s</dd><dt>q_net proxy</dt><dd>${format(frame.q_net)}</dd><dt>f_dress proxy</dt><dd>${format(frame.f_dress)}</dd><dt>quality</dt><dd>${format(frame.topology_quality)}</dd>`;
    }
    function drawPlot() {
      const summaries=payload.phase_space || [];
      Plotly.newPlot('plot', [{x:summaries.map(x=>x.q_net_mean), y:summaries.map(x=>x.f_dress_mean), mode:'lines+markers+text', text:summaries.map(x=>x.task_label), textposition:'top center', marker:{size:10,color:'#50a8e5'}, line:{color:'#50a8e5'}}], {title:{text:'Proxy phase space',font:{size:14,color:'#e8edf4'}}, xaxis:{title:'q_net proxy',color:'#aeb8c7'}, yaxis:{title:'f_dress proxy',color:'#aeb8c7'}, paper_bgcolor:'#11151c',plot_bgcolor:'#11151c',margin:{l:55,r:10,t:40,b:50}}, {displayModeBar:false,responsive:true});
    }

    // Real per-subject H1 (loop) persistence diagrams from
    // tools/command_center/real_results_adapter.build_pitnn_cohort_persistence_artifact
    // -- last window per condition, the same pair cubical_h1_bottleneck_distance_last_window
    // was computed from. "unavailable" (no cohort run with --export-persistence) is shown
    // as an explicit notice, never a silently empty plot.
    const persistenceSelect = document.getElementById('persistence-subject');
    const persistencePlot = document.getElementById('persistence-plot');
    const persistenceNotice = document.getElementById('persistence-notice');
    const persistenceMetrics = document.getElementById('persistence-metrics');
    let persistenceArtifact;

    function drawPersistenceDiagram(subjectId) {
      const subject = (persistenceArtifact.subjects || []).find(s => s.subject_id === subjectId);
      if (!subject) return;
      const traces = [];
      const stateColor = { awake: '#50a8e5', sedated: '#e0685a' };
      for (const [state, pairs] of Object.entries(subject.diagrams_h1 || {})) {
        const finite = (pairs || []).filter(p => p[1] !== null && Number.isFinite(p[1]));
        traces.push({
          x: finite.map(p => p[0]), y: finite.map(p => p[1]), mode: 'markers', name: state,
          marker: { size: 8, color: stateColor[state] || '#aeb8c7' },
        });
      }
      const allVals = traces.flatMap(t => [...t.x, ...t.y]);
      const axisMax = allVals.length ? Math.max(...allVals) * 1.1 : 1;
      traces.push({ x: [0, axisMax], y: [0, axisMax], mode: 'lines', line: { color: '#3a4451', dash: 'dot' }, showlegend: false, hoverinfo: 'skip' });
      Plotly.newPlot('persistence-plot', traces, {
        title: { text: `H1 birth/death -- ${subjectId}`, font: { size: 14, color: '#e8edf4' } },
        xaxis: { title: 'birth', color: '#aeb8c7' }, yaxis: { title: 'death', color: '#aeb8c7' },
        paper_bgcolor: '#11151c', plot_bgcolor: '#11151c', margin: { l: 55, r: 10, t: 40, b: 50 },
        legend: { font: { color: '#e8edf4' } },
      }, { displayModeBar: false, responsive: true });
      const distance = subject.bottleneck_distance_h1_last_window;
      persistenceMetrics.innerHTML = `<dt>awake-sedated H1 bottleneck</dt><dd>${format(distance)}</dd>`;
    }

    function loadPersistenceArtifact() {
      persistenceArtifact = payload.pitnn_cohort_persistence_artifact;
      if (!persistenceArtifact || persistenceArtifact.status !== 'available') {
        persistenceNotice.textContent = (persistenceArtifact && persistenceArtifact.reason)
          || 'No PITNN cohort persistence diagrams available.';
        persistenceSelect.style.display = 'none'; persistencePlot.style.display = 'none';
        return;
      }
      persistenceNotice.textContent = `${persistenceArtifact.subject_count} subject(s) with real H1 diagrams.`;
      persistenceSelect.innerHTML = persistenceArtifact.subjects.map(s => `<option value="${s.subject_id}">${s.subject_id}</option>`).join('');
      persistenceSelect.style.display = 'block'; persistencePlot.style.display = 'block';
      drawPersistenceDiagram(persistenceArtifact.subjects[0].subject_id);
    }
    persistenceSelect.addEventListener('change', (event) => drawPersistenceDiagram(event.target.value));

    slider.addEventListener('input', () => update(Number(slider.value)));
    document.getElementById('play').addEventListener('click', (event) => { playing=!playing; event.currentTarget.textContent=playing?'Pause':'Play'; });
    setInterval(() => { if (playing && payload.frames.length) { slider.value=(Number(slider.value)+1)%payload.frames.length; update(Number(slider.value)); }}, 200);
    fetch('/command-center/visualization').then(r=>r.json()).then(data => { payload=data; slider.max=Math.max(0,payload.frames.length-1); notice.textContent=payload.spatial_artifact.status === 'available' ? 'Spatial artifact available.' : payload.spatial_artifact.reason + ' The bilateral scaffold visualizes real scalar telemetry only; it is not anatomical localization.'; status.textContent=`${payload.dataset}: ${payload.frames.length} empirical telemetry frames`; update(0); drawPlot(); loadPersistenceArtifact(); }).catch(error => { status.textContent='Could not load telemetry'; notice.textContent=error.message; });
  </script>
</body>
</html>
